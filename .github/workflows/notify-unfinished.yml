name: Weekly Dev Team Unfinished Tasks

on:
  workflow_run:
    workflows: ["Azure to Firestore Sync"]
    types:
      - completed
  workflow_dispatch:

jobs:
  notify:
    # Only run if triggered by schedule/sync completion (not on failed sync)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Send unfinished tasks notification
        env:
          SPRINT_NOTIFY_URL: ${{ secrets.SPRINT_NOTIFY_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: node notify_unfinished.js
