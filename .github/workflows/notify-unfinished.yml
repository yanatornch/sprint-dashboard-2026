name: Weekly Dev Team Unfinished Tasks

on:
  # Notifications paused — auto-trigger on sync completion removed.
  # Manual-only via workflow_dispatch. To resume, restore the workflow_run trigger.
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Send unfinished tasks notification
        env:
          SPRINT_NOTIFY_URL: ${{ secrets.SPRINT_NOTIFY_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: node notify_unfinished.js
