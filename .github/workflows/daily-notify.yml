name: Daily Sprint Snapshot & Notify

on:
  schedule:
    # Every day at 17:45 ICT (10:45 UTC)
    - cron: '45 10 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Sync Azure → Firestore
        env:
          AZURE_ORG: ${{ secrets.AZURE_ORG || 'morestudio' }}
          AZURE_PROJECT: ${{ secrets.AZURE_PROJECT || 'M' }}
          AZURE_PAT: ${{ secrets.AZURE_PAT || secrets.ADO_PAT }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: node azure_sync.js

  snapshot:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Take daily task snapshot
        run: node daily_snapshot.js

  notify:
    needs: snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily-sprint notification
        run: |
          curl -s -X POST "${{ secrets.SPRINT_DASHBOARD_URL }}/api/notify/daily-sprint" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.WEBHOOK_SECRET }}"
