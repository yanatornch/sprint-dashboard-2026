name: Daily Azure Sync

# Notifications are paused — this workflow only syncs Azure DevOps → Firestore.
# WEBHOOK_URL is intentionally NOT passed so azure_sync.js skips its own webhook.
# To resume notifications, restore the snapshot + notify jobs (see git history).

on:
  schedule:
    # 11:00 UTC = 18:00 ICT. Note: GitHub free-tier cron can be delayed up to ~3 hrs.
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Sync Azure → Firestore
        env:
          AZURE_ORG: ${{ secrets.AZURE_ORG || 'morestudio' }}
          AZURE_PROJECT: ${{ secrets.AZURE_PROJECT || 'M' }}
          AZURE_PAT: ${{ secrets.AZURE_PAT || secrets.ADO_PAT }}
        run: node azure_sync.js
