name: Azure to Firestore Sync

on:
  schedule:
    # Every Friday at 18:00 ICT (11:00 UTC)
    - cron: '0 11 * * 5'
  workflow_dispatch: # Allows manual trigger from the GitHub UI or Sync Azure button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Azure Sync Script
        # WEBHOOK_URL intentionally omitted so azure_sync.js skips its webhook (notifications paused).
        env:
          AZURE_ORG: ${{ secrets.AZURE_ORG }}
          AZURE_PROJECT: ${{ secrets.AZURE_PROJECT }}
          AZURE_PAT: ${{ secrets.AZURE_PAT || secrets.ADO_PAT }}
        run: node azure_sync.js
