name: Azure to Firestore Sync

on:
  schedule:
    # Runs at 23:00 UTC every Friday
    - cron: '0 23 * * 5'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Azure Sync Script
        env:
          AZURE_ORG: ${{ secrets.AZURE_ORG }}
          AZURE_PROJECT: ${{ secrets.AZURE_PROJECT }}
          AZURE_PAT: ${{ secrets.AZURE_PAT || secrets.ADO_PAT }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: node azure_sync.js
