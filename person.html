<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Person · Sprint Dashboard 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #0a0f1c; --bg-2: #0d1424;
    --panel: #131b2e; --panel-2: #0f1626; --panel-hi: #1a2338;
    --border: rgba(255,255,255,.07); --border-hi: rgba(255,255,255,.12);
    --text: #e9edf6; --muted: #8b94a8; --faint: #5a6379;
    --indigo: #7c7ff5; --indigo-deep: #6366f1;
    --cyan: #2ad4e5; --teal: #34d399; --green: #2fd39b;
    --orange: #f5a524; --red: #f0556a; --yellow: #f5c518;
    --gold: #f5c518; --pink: #f43f6e;
    --r: 16px; --r-lg: 22px;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background:
      radial-gradient(1200px 600px at 18% -8%, rgba(124,127,245,.10), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(42,212,229,.06), transparent 55%),
      var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
    min-height: 100vh;
  }
  ::selection { background: rgba(124,127,245,.35); }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 26px 28px 80px; }

  /* Header */
  .topbar { display: flex; align-items: center; gap: 18px; padding: 8px 2px 22px; flex-wrap: wrap; }
  .btn-back {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 11px 16px; border-radius: 999px;
    font: 600 14px/1 var(--font); cursor: pointer; transition: .18s;
    text-decoration: none;
  }
  .btn-back:hover { background: var(--panel-hi); border-color: var(--border-hi); }
  .avatar {
    width: 60px; height: 60px; border-radius: 50%;
    display: grid; place-items: center; flex: none;
    font: 800 21px/1 var(--font); color: #fff; letter-spacing: .5px;
    box-shadow: 0 8px 22px rgba(99,102,241,.45);
  }
  .who { display: flex; flex-direction: column; gap: 3px; }
  .who-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .who-top h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
  .role-badge {
    font: 700 12px/1 var(--font); padding: 5px 10px; border-radius: 999px;
  }
  .who-sub { color: var(--muted); font-size: 14.5px; font-weight: 500; }
  .who-sub b { color: var(--text); font-weight: 700; }
  .spacer { flex: 1; min-width: 0; }

  /* Generic panel */
  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border); border-radius: var(--r-lg);
    box-shadow: var(--shadow);
  }
  .panel-pad { padding: 22px 24px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
  .panel-head h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.2px; }
  .pill {
    font: 600 12.5px/1 var(--font); color: var(--muted);
    background: var(--panel-hi); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 999px;
  }
  .section-label {
    font: 700 12px/1 var(--font); letter-spacing: 2px; text-transform: uppercase;
    color: var(--faint); margin: 30px 2px 14px;
  }
  .grid { display: grid; gap: 16px; }

  @keyframes rise { from { transform: translateY(10px); opacity: .7; } to { transform: none; opacity: 1; } }
  .rise { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes burst {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
  }

  /* Task list */
  .task-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .task-filter-select {
    background: var(--panel-hi); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font: 600 13px/1 var(--font); outline: none; cursor: pointer;
  }
  .task-filter-select:focus { border-color: var(--indigo); }
  .task-item {
    display: flex; align-items: flex-start; gap: 12px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
    transition: border-color .12s;
  }
  .task-item:hover { border-color: rgba(124,127,245,.35); }
  .task-title { font-weight: 700; font-size: 13px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  .task-state { padding: 3px 9px; border-radius: 5px; font-size: 11px; font-weight: 700; }
  .task-pts { font-size: 12px; color: var(--muted); font-weight: 600; }
  .task-sprint { font-size: 11px; background: var(--panel); border: 1px solid var(--border); padding: 2px 8px; border-radius: 999px; color: var(--muted); font-weight: 600; }
  .task-project { font-size: 11px; color: var(--faint); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }

  /* Loading */
  #root:empty::after {
    content: "Loading…";
    display: flex; align-items: center; justify-content: center;
    min-height: 80vh; font-size: 16px; color: var(--muted);
    position: fixed; inset: 0;
  }

  /* Tweaks panel light override (panel has light background) */
  button { font-family: var(--font); }

  @media (max-width: 900px) {
    .wrap { padding: 16px 16px 60px; }
    .who-top h1 { font-size: 22px; }
    .avatar { width: 46px; height: 46px; font-size: 16px; }
  }
  @media (max-width: 600px) {
    .wrap { padding: 12px 12px 48px; }
    .who-top h1 { font-size: 18px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Firebase data loader — runs first, sets window.DATA, then signals React -->
<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

// ── Constants ────────────────────────────────────────────────────────────────
const ROLES = {
  "Waew":"BA","Torfah":"BA","Tae":"BA",
  "Ploy":"Designer","Gib":"Designer","Nine":"Designer",
  "Ping":"Tester","Dream":"PC","Karn":"CEO",
  "Ohm":"Dev","Nust":"Dev","Unn":"Dev","Praew":"Dev","P":"Dev","No":"Dev","Tum":"Dev"
};
const ROLE_COLORS = {
  "Dev":"#6366f1","Designer":"#ec4899","BA":"#a855f7",
  "Tester":"#06b6d4","PC":"#f59e0b","CEO":"#10b981"
};
const STATUS_LABELS = [
  "Done","In Progress","Ready for review","Ready for test",
  "Waiting to INT deploy","Waiting to PRD deploy","To Do","Blocked","Bugged","Removed/Canceled"
];
const STATUS_COLORS = [
  "var(--green)","var(--cyan)","var(--indigo)","var(--teal)",
  "var(--orange)","#fb923c","var(--faint)","var(--red)","var(--red)","var(--faint)"
];
const SPRINT_START = "2026-01-05";
const SPRINT_WEEKS = 2;
const MAX_SPRINTS = 26;

function generateSprintDates() {
  const dates = [], start = new Date(SPRINT_START);
  const today = new Date(new Date().toISOString().slice(0,10));
  for (let i = 0; i < MAX_SPRINTS; i++) {
    const s = new Date(start); s.setDate(s.getDate() + i * SPRINT_WEEKS * 7);
    const e = new Date(s);     e.setDate(e.getDate() + SPRINT_WEEKS * 7 - 1);
    if (s > today) break;
    dates.push({ s: s.toISOString().slice(0,10), e: e.toISOString().slice(0,10) });
  }
  return dates;
}
const SPRINT_DATES = generateSprintDates();

function currentSprintIdx() {
  const d = new Date().toISOString().slice(0,10);
  for (let i = 0; i < SPRINT_DATES.length; i++)
    if (d >= SPRINT_DATES[i].s && d <= SPRINT_DATES[i].e) return i;
  return SPRINT_DATES.length - 1;
}
const CURRENT_SPRINT_IDX = currentSprintIdx();

const REWARDS = [
  { pts:50,  emoji:"☕", name:"Coffee Voucher",       desc:"ฟรีกาแฟ 1 แก้ว ที่ร้านในตึก",          tag:"Café" },
  { pts:100, emoji:"🍜", name:"Restaurant 10% Off",   desc:"ส่วนลด 10% ร้านอาหารพาร์ทเนอร์",       tag:"Dining" },
  { pts:150, emoji:"🎬", name:"Movie Ticket ×1",      desc:"ตั๋วหนัง 1 ใบ รอบปกติ",                tag:"Leisure" },
  { pts:200, emoji:"🍱", name:"Free Team Lunch",      desc:"ข้าวกล่องพรีเมียม 1 มื้อ",             tag:"Dining" },
  { pts:250, emoji:"🎧", name:"฿500 Gadget Credit",   desc:"เครดิตซื้ออุปกรณ์ทำงาน",               tag:"Gear" },
  { pts:300, emoji:"🛒", name:"฿500 Shopping Voucher",desc:"บัตรกำนัลห้างสรรพสินค้า",              tag:"Voucher" },
  { pts:350, emoji:"🚗", name:"Grab Credit ฿300",     desc:"เครดิตเดินทาง 1 เดือน",                tag:"Travel" },
  { pts:400, emoji:"🍰", name:"Dessert Party",        desc:"ขนมหวานเลี้ยงทีม",                     tag:"Dining" },
  { pts:450, emoji:"📚", name:"฿1,000 Learning Budget",desc:"คอร์ส/หนังสือพัฒนาตัวเอง",           tag:"Growth" },
  { pts:500, emoji:"🏖️",name:"Half Day Off",         desc:"ลาครึ่งวันแบบไม่หักวันลา",             tag:"Time off" },
  { pts:550, emoji:"💆", name:"Spa & Massage",        desc:"นวดผ่อนคลาย 60 นาที",                  tag:"Wellness" },
  { pts:600, emoji:"🎁", name:"Mystery Box",          desc:"กล่องสุ่มของรางวัลพิเศษ",              tag:"Surprise" },
  { pts:650, emoji:"🍽️",name:"Dinner for Two",       desc:"ดินเนอร์ 2 ที่ ร้านพรีเมียม",          tag:"Dining" },
  { pts:700, emoji:"🏨", name:"Hotel Staycation",     desc:"เข้าพักโรงแรม 1 คืน",                  tag:"Travel" },
  { pts:750, emoji:"🎮", name:"Game Console Raffle",  desc:"สิทธิ์ลุ้นเครื่องเกม",                tag:"Surprise" },
  { pts:800, emoji:"✈️",name:"Full Day Off",          desc:"วันหยุดพิเศษ 1 วันเต็ม",               tag:"Time off" },
];
const TIERS = [
  { name:"Bronze",   min:0,   color:"#c98a4b" },
  { name:"Silver",   min:200, color:"#aab4c6" },
  { name:"Gold",     min:400, color:"#f5c518" },
  { name:"Platinum", min:600, color:"#6ee7e0" },
  { name:"Diamond",  min:800, color:"#8b9cff" },
];

// ── URL param ────────────────────────────────────────────────────────────────
const PERSON = new URLSearchParams(location.search).get("name") || "";

function sum(a) { return a.reduce((x,y)=>x+(+y||0),0); }

// ── Load Firebase ────────────────────────────────────────────────────────────
let rawData;
try {
  const [usersSnap, sprintsSnap, tasksSnap, userStatsSnap, leavesSnap] = await Promise.all([
    getDocs(collection(db,"users")),
    getDocs(collection(db,"sprints")),
    getDocs(collection(db,"tasks")),
    getDocs(collection(db,"sprintUserStats")),
    getDocs(collection(db,"leaves")),
  ]);

  const sprintDocs = [];
  sprintsSnap.forEach(d => sprintDocs.push(d.data()));
  sprintDocs.sort((a,b) => a.index - b.index);
  const sprints = sprintDocs.map(s => s.name);
  const SPR = sprints.length;

  const movement = [];
  tasksSnap.forEach(d => movement.push(d.data()));

  const users = [];
  usersSnap.forEach(d => users.push(d.data().id));

  const points = {}, tasks = {};
  users.forEach(u => { points[u] = new Array(SPR).fill(0); tasks[u] = new Array(SPR).fill(0); });
  userStatsSnap.forEach(d => {
    const s = d.data();
    if (!points[s.userId]) points[s.userId] = new Array(SPR).fill(0);
    if (!tasks[s.userId])  tasks[s.userId]  = new Array(SPR).fill(0);
    points[s.userId][s.sprintIndex] = s.points;
    tasks[s.userId][s.sprintIndex]  = s.tasks;
  });

  // Contribution + status per person
  const contribution = {}, statusCount = {}, statusPts = {};
  movement.forEach(t => {
    const p = t.person, proj = t.project, si = (t.sprint||1)-1, v = parseFloat(t.points)||0;
    if (!contribution[p]) contribution[p] = {};
    if (!contribution[p][proj]) contribution[p][proj] = new Array(SPR).fill(0);
    contribution[p][proj][si] += v;

    let lbl = "To Do";
    const st = (t.state||"").toLowerCase();
    if (st.includes("done")||st==="closed") lbl = "Done";
    else if (st.includes("progress")||st==="active") lbl = "In Progress";
    else if (st.includes("ready for review")) lbl = "Ready for review";
    else if (st.includes("ready for test"))   lbl = "Ready for test";
    else if (st.includes("waiting to int"))   lbl = "Waiting to INT deploy";
    else if (st.includes("waiting to prd"))   lbl = "Waiting to PRD deploy";
    else if (st.includes("block")) lbl = "Blocked";
    else if (st.includes("bug"))   lbl = "Bugged";
    else if (st.includes("cancel")||st.includes("remov")) lbl = "Removed/Canceled";
    if (!statusCount[p]) statusCount[p] = {};
    if (!statusPts[p])   statusPts[p]   = {};
    statusCount[p][lbl] = (statusCount[p][lbl]||0) + 1;
    statusPts[p][lbl]   = (statusPts[p][lbl]||0)   + v;
  });

  // Leaves
  const leavesData = {};
  leavesSnap.forEach(d => {
    const l = d.data(); if (!l.sprint) return;
    if (!leavesData[l.sprint]) leavesData[l.sprint] = {};
    if (!leavesData[l.sprint][l.person]) leavesData[l.sprint][l.person] = [];
    leavesData[l.sprint][l.person].push({ type:l.type, startDate:l.startDate, endDate:l.endDate, days:l.days||1 });
  });

  rawData = { sprints, SPR, movement, points, tasks, contribution, statusCount, statusPts, leavesData };
} catch (e) {
  document.getElementById("root").innerHTML =
    `<div style="color:#f0556a;padding:40px;font-family:sans-serif;"><h2>Firebase Error</h2><pre>${e.stack}</pre></div>`;
  throw e;
}

// ── Validate person ──────────────────────────────────────────────────────────
const allPeople = Object.keys(rawData.points);
if (!PERSON || !allPeople.includes(PERSON)) {
  document.getElementById("root").innerHTML = `
    <div style="padding:60px;max-width:460px;margin:0 auto;text-align:center;font-family:sans-serif;">
      <div style="font-size:56px;margin-bottom:16px;">👤</div>
      <div style="font-size:20px;font-weight:800;margin-bottom:8px;color:#e9edf6;">Person not found</div>
      <div style="color:#8b94a8;font-size:14px;margin-bottom:28px;">${PERSON ? `"${PERSON}" is not in the team roster.` : "No name specified in URL."}</div>
      <a href="/" style="display:inline-flex;align-items:center;gap:6px;padding:12px 24px;background:#6366f1;color:#fff;border-radius:999px;font-size:14px;font-weight:700;text-decoration:none;">← Back to Dashboard</a>
    </div>`;
  throw new Error("Person not found");
}

// ── Build window.DATA ────────────────────────────────────────────────────────
const { sprints, SPR, movement, points, tasks, contribution, statusCount, statusPts, leavesData } = rawData;
const role = ROLES[PERSON] || "—";
const roleColor = ROLE_COLORS[role] || "#94a3b8";

const ptsArr  = points[PERSON]  || [];
const tksArr  = tasks[PERSON]   || [];
const contrib = contribution[PERSON] || {};
const sCount  = statusCount[PERSON] || {};
const sPts    = statusPts[PERSON]   || {};

const totalPts   = sum(ptsArr);
const totalTasks = sum(tksArr);
const activeSprints = ptsArr.filter((v,i) => (+v||0)>0||(+tksArr[i]||0)>0).length;
const avgPerTask = totalTasks ? totalPts/totalTasks : 0;
const grandPts   = sum(Object.values(sPts));
const donePts    = sPts["Done"] || 0;
const doneRate   = grandPts ? donePts/grandPts : 0;

// Latest active sprint
let latest = -1;
for (let i = Math.min(SPR-1, CURRENT_SPRINT_IDX); i >= 0; i--) {
  if (allPeople.some(n => (points[n]||[])[i] > 0)) { latest = i; break; }
}

// Trend
let trendLabel = "ไม่มีข้อมูลเพียงพอ", trendDot = "var(--faint)";
if (latest >= 2) {
  const recent = sum(ptsArr.slice(Math.max(0,latest-2), latest+1));
  const prior  = sum(ptsArr.slice(Math.max(0,latest-5), Math.max(0,latest-2)));
  if (recent===0 && prior===0) { trendLabel = "ไม่มีข้อมูลเพียงพอ"; trendDot = "var(--faint)"; }
  else if (prior===0) { trendLabel = `เพิ่มขึ้น (+${recent.toFixed(0)} pts)`; trendDot = "var(--green)"; }
  else {
    const delta = recent - prior, pct = (delta/prior)*100;
    if (delta > 0)  { trendLabel = `📈 กำลังเร่ง (+${pct.toFixed(0)}%)`; trendDot = "var(--green)"; }
    else if (delta < 0) { trendLabel = `📉 ชะลอลง (${pct.toFixed(0)}%)`; trendDot = pct < -40 ? "var(--orange)" : "var(--cyan)"; }
    else { trendLabel = "คงที่"; trendDot = "var(--cyan)"; }
  }
}

// Peak sprint
let peakIdx = 0, peakVal = 0;
ptsArr.forEach((v,i) => { if ((+v||0) > peakVal) { peakVal = +v; peakIdx = i; } });

// Top projects
const projEntries = Object.entries(contrib)
  .map(([k,arr]) => [k, sum(arr)]).filter(([,v]) => v > 0)
  .sort((a,b) => b[1]-a[1]);

// Status hero + rest
const statusHero = [
  { key:"done",       label:"Done",                tasks: sCount["Done"]||0,              pts: sPts["Done"]||0,              color:"var(--green)", emoji:"✅" },
  { key:"inprogress", label:"In Progress",          tasks: sCount["In Progress"]||0,       pts: sPts["In Progress"]||0,       color:"var(--cyan)",  emoji:"🛠️" },
  { key:"review",     label:"Ready for Review",     tasks: sCount["Ready for review"]||0,  pts: sPts["Ready for review"]||0,  color:"var(--indigo)",emoji:"👀" },
];
const statusRest = [
  { label:"Ready for test",         tasks: sCount["Ready for test"]||0,           pts: sPts["Ready for test"]||0,           color:"var(--teal)" },
  { label:"Waiting to PRD deploy",  tasks: sCount["Waiting to PRD deploy"]||0,    pts: sPts["Waiting to PRD deploy"]||0,    color:"var(--orange)" },
  { label:"Waiting to INT deploy",  tasks: sCount["Waiting to INT deploy"]||0,    pts: sPts["Waiting to INT deploy"]||0,    color:"var(--orange)" },
  { label:"To Do",                  tasks: sCount["To Do"]||0,                    pts: sPts["To Do"]||0,                    color:"var(--faint)" },
  { label:"Blocked",                tasks: sCount["Blocked"]||0,                  pts: sPts["Blocked"]||0,                  color:"var(--red)" },
  { label:"Bugged",                 tasks: sCount["Bugged"]||0,                   pts: sPts["Bugged"]||0,                   color:"var(--red)" },
  { label:"Removed/Canceled",       tasks: sCount["Removed/Canceled"]||0,        pts: sPts["Removed/Canceled"]||0,         color:"var(--faint)" },
].filter(s => s.tasks > 0);

// Insights
const blockedC = sCount["Blocked"] || 0;
const buggedC  = sCount["Bugged"]  || 0;
const wipC     = (sCount["In Progress"]||0)+(sCount["Ready for review"]||0)+(sCount["Ready for test"]||0)+(sCount["Waiting to INT deploy"]||0)+(sCount["Waiting to PRD deploy"]||0);
const todoC    = sCount["To Do"] || 0;
const stale    = latest >= 1 && !(ptsArr[latest]>0||tksArr[latest]>0) && !(ptsArr[latest-1]>0||tksArr[latest-1]>0);
const insights = [];
insights.push({ emoji:"📦", title:"Workload",     value:`${totalPts.toLocaleString(undefined,{maximumFractionDigits:1})} pts · ${totalTasks} tasks`,  sub:`Active in ${activeSprints}/${SPR} sprints · avg ${avgPerTask.toFixed(2)} pts/task`, dot: totalPts===0?"var(--orange)":"var(--green)" });
insights.push({ emoji:"✅", title:"Done Rate",    value:`${(doneRate*100).toFixed(1)}% ของ points`, sub:`${donePts.toFixed(1)} / ${grandPts.toFixed(1)} pts`, dot: doneRate>=.7?"var(--green)":doneRate>=.4?"var(--cyan)":"var(--orange)" });
insights.push({ emoji:"📈", title:"Recent Trend", value:trendLabel, sub:"เทียบ 3 sprints ล่าสุด vs 3 ก่อนหน้า", dot:trendDot });
if (peakVal > 0) insights.push({ emoji:"🚀", title:"Peak Sprint", value:`Sprint ${peakIdx+1} — ${peakVal.toLocaleString(undefined,{maximumFractionDigits:1})} pts`, sub:"สูงสุดของปี", dot:"var(--cyan)" });
if (projEntries.length) insights.push({ emoji:"🎯", title:"Top Projects", value:projEntries.slice(0,2).map(([k,v])=>`${k} (${v.toFixed(0)})`).join(" · "), sub:`${projEntries.length} projects contributed`, dot:"var(--cyan)" });
if (blockedC>0||buggedC>0) insights.push({ emoji:"⚠️", title:"Risk Flags", value:`${blockedC} Blocked · ${buggedC} Bugged`, sub:"ต้องติดตามปลดล็อกและแก้ไข", dot:"var(--red)" });
if (wipC>0) insights.push({ emoji:"🔄", title:"WIP", value:`${wipC} tasks`, sub:"In Progress + Review/Test + Waiting", dot: wipC>15?"var(--orange)":"var(--cyan)" });
if (stale)  insights.push({ emoji:"⏰", title:"Stale", value:"ไม่พบ task 2 sprints ล่าสุด", sub:`Sprint ${latest}-${latest+1} ไม่มี activity`, dot:"var(--red)" });

// Sprint trend data
const sprintTrend = sprints.map((_, i) => ({
  sprint: i+1,
  pts:   +ptsArr[i] || 0,
  tasks: +tksArr[i] || 0,
}));
const ptsMax  = Math.max(1, ...sprintTrend.map(d => d.pts));
const taskMax = Math.max(1, ...sprintTrend.map(d => d.tasks));

// Leave
const LEAVE_ICON = { vacation:"🏖️", sick:"🤒", personal:"🏠", other:"📅" };
const personLeaves = [];
Object.entries(leavesData||{}).forEach(([sprint, byP]) => {
  if (byP[PERSON]) byP[PERSON].forEach(l => personLeaves.push({ sprint:parseInt(sprint), ...l }));
});
personLeaves.sort((a,b) => a.sprint - b.sprint);
const leaveEntries = personLeaves.map(l => ({
  sprint: l.sprint,
  kind: l.type,
  days: l.days,
  range: l.startDate === l.endDate ? l.startDate : `${l.startDate} – ${l.endDate}`,
  icon: LEAVE_ICON[l.type?.toLowerCase()] || "📅",
}));

// All tasks for this person (for task list)
const personTasks = movement.filter(t => t.person === PERSON);

// Initials
const words = PERSON.trim().split(/\s+/);
const initials = words.length === 1 ? PERSON.slice(0,2).toUpperCase() : (words[0][0]+words[1][0]).toUpperCase();

document.title = `${PERSON} · Sprint Dashboard 2026`;

window.DATA = {
  person: { name:PERSON, initials, role, roleColor, sprintsActive:activeSprints, sprintsTotal:SPR, totalPoints:totalPts, totalTasks },
  stats: { totalPoints:totalPts, totalTasks, doneRatePct:(doneRate*100).toFixed(1), donePts:donePts.toFixed(1), targetPts:grandPts.toFixed(1), avgPtsPerTask:avgPerTask.toFixed(2), activeSprints, sprintsTotal:SPR, projects:projEntries.length },
  statusHero, statusRest, insights, sprintTrend, ptsMax, taskMax,
  rewards: REWARDS, tiers: TIERS,
  leave: leaveEntries,
  projEntries, contrib, sprints, SPR,
  personTasks,
};

// Signal React app to mount
window.__dataReady = true;
window.dispatchEvent(new Event("dataReady"));

function __twkIsLight(hex) {
  const h = String(hex).replace('#','');
  const x = h.length===3 ? h.replace(/./g,(c)=>c+c) : h.padEnd(6,'0');
  const n = parseInt(x.slice(0,6),16);
  if (Number.isNaN(n)) return true;
  const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return r*299+g*587+b*114>148000;
}

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits==='object'&&keyOrEdits!==null ? keyOrEdits : {[keyOrEdits]:val};
    setValues(prev => ({...prev,...edits}));
    window.parent.postMessage({type:'__edit_mode_set_keys',edits},'*');
    window.dispatchEvent(new CustomEvent('tweakchange',{detail:edits}));
  },[]);
  return [values, setTweak];
}

function TweaksPanel({title='Tweaks',children}) {
  const [open,setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({x:16,y:16});
  const clamp = React.useCallback(()=>{
    const p=dragRef.current; if(!p) return;
    const w=p.offsetWidth,h=p.offsetHeight,PAD=16;
    offsetRef.current={
      x:Math.min(Math.max(PAD,window.innerWidth-w-PAD),Math.max(PAD,offsetRef.current.x)),
      y:Math.min(Math.max(PAD,window.innerHeight-h-PAD),Math.max(PAD,offsetRef.current.y)),
    };
    p.style.right=offsetRef.current.x+'px'; p.style.bottom=offsetRef.current.y+'px';
  },[]);
  React.useEffect(()=>{
    const onMsg=(e)=>{
      if(e?.data?.type==='__activate_edit_mode') setOpen(true);
      else if(e?.data?.type==='__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message',onMsg);
    window.parent.postMessage({type:'__edit_mode_available'},'*');
    return ()=>window.removeEventListener('message',onMsg);
  },[]);
  React.useEffect(()=>{ if(open) clamp(); },[open,clamp]);
  const dismiss=()=>{ setOpen(false); window.parent.postMessage({type:'__edit_mode_dismissed'},'*'); };
  const onDragStart=(e)=>{
    const p=dragRef.current; if(!p) return;
    const r=p.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;
    const sr=window.innerWidth-r.right,sb=window.innerHeight-r.bottom;
    const move=(ev)=>{ offsetRef.current={x:sr-(ev.clientX-sx),y:sb-(ev.clientY-sy)}; clamp(); };
    const up=()=>{ window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',up); };
    window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  };
  if (!open) return null;
  return (<>
    <style>{__TWEAKS_STYLE}</style>
    <div ref={dragRef} className="twk-panel" style={{right:offsetRef.current.x,bottom:offsetRef.current.y}}>
      <div className="twk-hd" onMouseDown={onDragStart}>
        <b>{title}</b>
        <button className="twk-x" onMouseDown={e=>e.stopPropagation()} onClick={dismiss}>✕</button>
      </div>
      <div className="twk-body">{children}</div>
    </div>
  </>);
}
function TweakSection({label}) { return <div className="twk-sect">{label}</div>; }
function TweakToggle({label,value,onChange}) {

<script type="text/babel">
function smoothPath(pts) {
  if (pts.length < 2) return "";
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+=` C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y}`;
  }
  return d;
}

function SprintTrendChart({data,ptsMax,taskMax}) {
  const W=1000,H=360,padL=44,padR=44,padT=22,padB=40;
  const iW=W-padL-padR,iH=H-padT-padB,n=data.length,band=iW/n;
  const x=(i)=>padL+band*(i+0.5);
  const yP=(v)=>padT+iH*(1-v/ptsMax);
  const yT=(v)=>padT+iH*(1-v/taskMax);
  const linePts=data.map((d,i)=>({x:x(i),y:yT(d.tasks)}));
  const path=smoothPath(linePts);
  const ptsSteps=5;
  const ptsGrid=Array.from({length:ptsSteps+1},(_,i)=>Math.round((ptsMax/ptsSteps)*i));
  const taskSteps=4;
  const taskGrid=Array.from({length:taskSteps+1},(_,i)=>Math.round((taskMax/taskSteps)*i));
  return <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:"auto",display:"block"}}>
    <defs>
      <linearGradient id="barFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor="var(--indigo)"/>
        <stop offset="100%" stopColor="var(--indigo-deep)"/>
      </linearGradient>
      <linearGradient id="lineGlow" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stopColor="rgba(42,212,229,.25)"/>
        <stop offset="100%" stopColor="rgba(42,212,229,0)"/>
      </linearGradient>
    </defs>
    {ptsGrid.map(v=><g key={v}>
      <line x1={padL} y1={yP(v)} x2={W-padR} y2={yP(v)} stroke="rgba(255,255,255,.06)"/>
      <text x={padL-10} y={yP(v)+4} textAnchor="end" fontSize="12" fill="var(--faint)">{v}</text>
    </g>)}
    {taskGrid.map(v=><text key={v} x={W-padR+10} y={yT(v)+4} textAnchor="start" fontSize="12" fill="var(--faint)">{v}</text>)}
    {data.map((d,i)=>{
      const bw=band*0.5,h=iH*(d.pts/ptsMax);
      return <g key={i}>
        <rect x={x(i)-bw/2} y={yP(d.pts)} width={bw} height={Math.max(h,0)} rx="5" fill="url(#barFill)" opacity={d.pts?0.95:0.15}/>
        <text x={x(i)} y={H-14} textAnchor="middle" fontSize="12" fontWeight="600" fill="var(--muted)">Sp {d.sprint}</text>
        {d.pts>0&&<text x={x(i)} y={yP(d.pts)-6} textAnchor="middle" fontSize="10.5" fontWeight="700" fill="var(--indigo)">{d.pts}</text>}
      </g>;
    })}
    <path d={`${path} L ${x(n-1)} ${padT+iH} L ${x(0)} ${padT+iH} Z`} fill="url(#lineGlow)" opacity="0.6"/>
    <path d={path} fill="none" stroke="#2ad4e5" strokeWidth="3" strokeLinecap="round"/>
    {linePts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="4.5" fill="var(--bg)" stroke="#2ad4e5" strokeWidth="2.5"/>)}
  </svg>;
}

function ChartLegend() {
  const item=(color,label,hollow)=><span style={{display:"inline-flex",alignItems:"center",gap:7,fontSize:13,fontWeight:600,color:"var(--muted)"}}>
    <span style={{width:12,height:12,borderRadius:3,background:hollow?"transparent":color,border:hollow?`2px solid ${color}`:"none"}}/>
    {label}
  </span>;
  return <div style={{display:"flex",gap:22,justifyContent:"center",marginBottom:4}}>
    {item("#7c7ff5","Story Points")}
    {item("#2ad4e5","Tasks (count)",true)}
  </div>;
}

window.__ChartExports = {SprintTrendChart,ChartLegend};

<script type="text/babel">
function tierFor(points,tiers) {
  let cur=tiers[0];
  for (const t of tiers) if (points>=t.min) cur=t;
  const idx=tiers.indexOf(cur),next=tiers[idx+1]||null;
  return {cur,next};
}
function nextMilestone(points) { return Math.floor(points/50)*50+50; }

function RewardHero({points,rewards,claimed,tiers,onScrollToRewards}) {
  const {cur,next}=tierFor(points,tiers);
  const reached=rewards.filter(r=>r.pts<=points);
  const claimable=reached.filter(r=>!claimed.includes(r.pts)).length;
  const level=reached.length;
  const nm=nextMilestone(points),bandStart=nm-50;
  const pct=Math.min(100,Math.round(((points-bandStart)/50)*100));
  const toNext=nm-points;
  return <div className="panel rise" style={{padding:0,overflow:"hidden",position:"relative"}}>
    <div style={{position:"absolute",inset:0,pointerEvents:"none",background:`radial-gradient(700px 300px at 12% -20%, ${cur.color}33, transparent 60%), radial-gradient(600px 300px at 90% 120%, rgba(124,127,245,.18), transparent 60%)`}}/>

          <div style={{position:"absolute",inset:7,borderRadius:"50%",background:"var(--panel)",display:"grid",placeItems:"center",border:`1px solid ${cur.color}55`}}>
            <div style={{textAlign:"center",lineHeight:1}}>
              <div style={{fontSize:11,fontWeight:700,color:"var(--faint)",letterSpacing:1}}>LVL</div>
              <div style={{fontSize:30,fontWeight:800,color:cur.color}}>{level}</div>
            </div>
          </div>
        </div>
        <span style={{font:"800 12px/1 var(--font)",letterSpacing:1.5,textTransform:"uppercase",color:cur.color,padding:"6px 12px",borderRadius:999,background:`${cur.color}1f`,border:`1px solid ${cur.color}55`}}>{cur.name}</span>
      </div>
      {/* progress */}
      <div>
        <div style={{font:"700 12px/1 var(--font)",letterSpacing:2,textTransform:"uppercase",color:"var(--faint)"}}>Reward Points</div>
        <div style={{display:"flex",alignItems:"baseline",gap:10,marginTop:6}}>
          <span style={{fontSize:54,fontWeight:800,letterSpacing:"-2px",lineHeight:1,background:"linear-gradient(120deg, #fff, var(--indigo))",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{points.toLocaleString()}</span>
          <span style={{color:"var(--muted)",fontWeight:700,fontSize:16}}>pts</span>
        </div>
        <div style={{marginTop:16,maxWidth:520}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,fontWeight:600,color:"var(--muted)",marginBottom:7}}>
            <span>Next reward at <b style={{color:"var(--text)"}}>{nm} pts</b></span>
            <span>{toNext} pts to go</span>
          </div>
          <div style={{height:12,borderRadius:999,background:"rgba(255,255,255,.07)",overflow:"hidden",border:"1px solid var(--border)"}}>
            <div style={{height:"100%",width:pct+"%",borderRadius:999,background:`linear-gradient(90deg, ${cur.color}, var(--indigo))`,boxShadow:`0 0 16px ${cur.color}aa`,transition:"width .8s cubic-bezier(.2,.8,.2,1)"}}/>
          </div>

      {/* claimable CTA */}
      <div style={{textAlign:"center"}}>
        <div style={{width:150,padding:"18px 14px",borderRadius:18,background:claimable?"linear-gradient(160deg, rgba(245,197,24,.18), rgba(245,165,36,.06))":"var(--panel-2)",border:`1px solid ${claimable?"rgba(245,197,24,.4)":"var(--border)"}`}}>
          <div style={{fontSize:40,fontWeight:800,color:claimable?"var(--gold)":"var(--faint)",lineHeight:1}}>{claimable}</div>
          <div style={{fontSize:12.5,fontWeight:700,color:"var(--muted)",marginTop:4}}>rewards ready</div>
          <button onClick={onScrollToRewards} disabled={!claimable} style={{marginTop:14,width:"100%",padding:"10px 0",borderRadius:999,cursor:claimable?"pointer":"default",border:"none",font:"700 13px/1 var(--font)",background:claimable?"linear-gradient(120deg, var(--gold), var(--orange))":"rgba(255,255,255,.06)",color:claimable?"#1a1206":"var(--faint)"}}>{claimable?"Claim now →":"All claimed"}</button>
        </div>
      </div>
    </div>
  </div>;
}

function MilestoneTrack({points,rewards,claimed}) {
  const railRef=useRef(null);
  useEffect(()=>{
    const el=railRef.current; if(!el) return;
    const idx=rewards.findIndex(r=>r.pts>points);
    const node=el.children[Math.max(0,idx-1)];
    if(node) el.scrollLeft=node.offsetLeft-40;
  },[]);
  return <div className="panel panel-pad rise">
    <div className="panel-head"><h2>🏁 Reward Journey</h2><span className="pill">+50 pts = 1 reward</span></div>
    <div ref={railRef} style={{display:"flex",gap:0,overflowX:"auto",paddingBottom:8}}>
      {rewards.map((r,i)=>{
        const reached=r.pts<=points,isClaimed=claimed.includes(r.pts);
        const state=isClaimed?"claimed":reached?"ready":"locked";
        const color=state==="ready"?"var(--gold)":state==="claimed"?"var(--green)":"var(--faint)";
        return <div key={r.pts} style={{minWidth:96,display:"flex",flexDirection:"column",alignItems:"center",position:"relative"}}>
          {i>0&&<div style={{position:"absolute",top:28,left:"-50%",width:"100%",height:3,background:r.pts<=points?"linear-gradient(90deg, var(--green), var(--gold))":"rgba(255,255,255,.08)"}}/>}
          <div style={{width:56,height:56,borderRadius:"50%",display:"grid",placeItems:"center",position:"relative",zIndex:1,background:state==="locked"?"var(--panel-2)":`${color}1f`,border:`2px solid ${state==="ready"?"var(--gold)":state==="claimed"?"var(--green)":"var(--border)"}`,fontSize:24,filter:state==="locked"?"grayscale(1) opacity(.55)":"none",boxShadow:state==="ready"?"0 0 18px rgba(245,197,24,.5)":"none"}}>
            {state==="locked"?"🔒":r.emoji}
            {state==="claimed"&&<span style={{position:"absolute",bottom:-4,right:-4,width:20,height:20,borderRadius:"50%",background:"var(--green)",color:"#08130d",display:"grid",placeItems:"center",fontSize:12,fontWeight:900}}>✓</span>}
          </div>
          <div style={{fontSize:12.5,fontWeight:800,marginTop:8,color:state==="locked"?"var(--faint)":"var(--text)"}}>{r.pts}</div>
          <div style={{fontSize:10.5,fontWeight:600,color:"var(--faint)",textTransform:"uppercase",letterSpacing:.5}}>{state==="ready"?"Ready":state==="claimed"?"Claimed":"Locked"}</div>
        </div>;
      })}
    </div>
  </div>;
}

function RewardCard({r,state,onClaim,confetti=true}) {
  const [burst,setBurst]=useState(false);
  const colors=["#f5c518","#2fd39b","#7c7ff5","#2ad4e5","#f0556a"];
  function claim(){
    if(confetti){setBurst(true);setTimeout(()=>setBurst(false),800);}
    onClaim(r.pts);
  }
  const ready=state==="ready",claimed=state==="claimed";
  return <div className="panel" style={{padding:"18px",position:"relative",overflow:"hidden",opacity:state==="locked"?.55:1,borderColor:ready?"rgba(245,197,24,.4)":"var(--border)"}}>
    {ready&&<div style={{position:"absolute",inset:0,background:"linear-gradient(160deg, rgba(245,197,24,.12), transparent 55%)",pointerEvents:"none"}}/>}
    <div style={{position:"relative",display:"flex",gap:14,alignItems:"flex-start"}}>
      <div style={{width:50,height:50,borderRadius:14,display:"grid",placeItems:"center",fontSize:26,flex:"none",background:"var(--panel-2)",border:"1px solid var(--border)",filter:state==="locked"?"grayscale(1)":"none"}}>{state==="locked"?"🔒":r.emoji}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:15,fontWeight:800}}>{r.name}</span>
          <span style={{fontSize:10.5,fontWeight:700,color:"var(--muted)",background:"var(--panel-hi)",border:"1px solid var(--border)",padding:"3px 7px",borderRadius:999}}>{r.tag}</span>
        </div>
        <div style={{color:"var(--muted)",fontSize:12.5,fontWeight:500,marginTop:4,lineHeight:1.4}}>{r.desc}</div>
      </div>
    </div>
    <div style={{position:"relative",display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:16}}>
      <span style={{fontSize:13,fontWeight:800,color:"var(--gold)"}}>★ {r.pts} pts</span>
      {ready&&<button onClick={claim} style={{padding:"9px 18px",borderRadius:999,border:"none",cursor:"pointer",font:"700 13px/1 var(--font)",background:"linear-gradient(120deg, var(--gold), var(--orange))",color:"#1a1206"}}>Redeem</button>}
      {claimed&&<span style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:13,fontWeight:700,color:"var(--green)"}}>✓ Claimed</span>}
      {state==="locked"&&<span style={{fontSize:12.5,fontWeight:700,color:"var(--faint)"}}>Locked</span>}
    </div>
    {burst&&<div style={{position:"absolute",top:"55%",right:50,pointerEvents:"none"}}>
      {Array.from({length:14}).map((_,i)=><span key={i} style={{position:"absolute",width:8,height:8,borderRadius:2,background:colors[i%colors.length],"--dx":(Math.cos((i/14)*6.28)*(40+Math.random()*40))+"px","--dy":(Math.sin((i/14)*6.28)*(40+Math.random()*40))+"px",animation:"burst .8s ease-out forwards"}}/>)}
    </div>}
  </div>;
}

function RewardsSection({points,claimed,onClaim,anchorRef,confetti}) {
  const [tab,setTab]=useState("ready");
  const stateOf=(r)=>claimed.includes(r.pts)?"claimed":(r.pts<=points?"ready":"locked");
  const D=window.DATA;
  const groups={ready:D.rewards.filter(r=>stateOf(r)==="ready"),claimed:D.rewards.filter(r=>stateOf(r)==="claimed"),locked:D.rewards.filter(r=>stateOf(r)==="locked")};
  const tabs=[{k:"ready",label:`Ready (${groups.ready.length})`},{k:"claimed",label:`Claimed (${groups.claimed.length})`},{k:"locked",label:`Locked (${groups.locked.length})`}];
  return <div ref={anchorRef} className="panel panel-pad rise">
    <div className="panel-head" style={{flexWrap:"wrap",gap:12}}>
      <h2>🎁 Rewards Store</h2>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {tabs.map(t=><button key={t.k} onClick={()=>setTab(t.k)} style={{padding:"8px 14px",borderRadius:999,cursor:"pointer",font:"600 12.5px/1 var(--font)",border:`1px solid ${tab===t.k?"var(--border-hi)":"var(--border)"}`,background:tab===t.k?"var(--panel-hi)":"transparent",color:tab===t.k?"var(--text)":"var(--muted)"}}>{t.label}</button>)}
      </div>
    </div>
    {groups[tab].length===0
      ?<div style={{color:"var(--faint)",fontSize:14,fontWeight:600,padding:"26px 0",textAlign:"center"}}>{tab==="ready"?"🎉 All caught up — keep earning points!":"Nothing here yet."}</div>
      :<div className="grid" style={{gridTemplateColumns:"repeat(auto-fill, minmax(290px, 1fr))"}}>
        {groups[tab].map(r=><RewardCard key={r.pts} r={r} state={stateOf(r)} onClaim={onClaim} confetti={confetti}/>)}
      </div>
    }
  </div>;
}

window.__GameExports = {RewardHero,MilestoneTrack,RewardCard,RewardsSection};
</script>

<!-- ── Task list component ────────────────────────────────────────────────── -->
<script type="text/babel">
const STATE_STYLE_MAP = {
  "Done":                    {bg:"rgba(47,211,155,.18)",  color:"#6ee7b7"},
  "In Progress":             {bg:"rgba(42,212,229,.18)",  color:"#67e8f9"},
  "Ready for review":        {bg:"rgba(124,127,245,.18)", color:"#c4b5fd"},
  "Ready for test":          {bg:"rgba(52,211,153,.18)",  color:"#6ee7b7"},
  "Waiting to INT deploy":   {bg:"rgba(245,165,36,.18)",  color:"#fcd34d"},
  "Waiting to PRD deploy":   {bg:"rgba(245,165,36,.18)",  color:"#fcd34d"},
  "To Do":                   {bg:"rgba(90,99,121,.25)",   color:"#94a3b8"},
  "Blocked":                 {bg:"rgba(240,85,106,.18)",  color:"#fca5a5"},
  "Bugged":                  {bg:"rgba(240,85,106,.18)",  color:"#fda4af"},
  "Removed/Canceled":        {bg:"rgba(90,99,121,.18)",   color:"#5a6379"},
};

function TaskList() {
  const D = window.DATA;
  const sprintOptions = D.sprints.map((s,i)=>({label:s,value:String(i+1)}));
  const projOptions   = D.projEntries.map(([k])=>k);
  const [sprintF,setSprintF] = useState("all");
  const [statusF,setStatusF] = useState("all");
  const [projF,  setProjF  ] = useState("all");

  const STATUS_LABELS_ALL = ["Done","In Progress","Ready for review","Ready for test","Waiting to INT deploy","Waiting to PRD deploy","To Do","Blocked","Bugged","Removed/Canceled"];

  function normState(raw) {
    const s = (raw||"").toLowerCase();
    if (s.includes("done")||s==="closed") return "Done";
    if (s.includes("progress")||s==="active") return "In Progress";
    if (s.includes("ready for review")) return "Ready for review";
    if (s.includes("ready for test"))   return "Ready for test";
    if (s.includes("waiting to int"))   return "Waiting to INT deploy";
    if (s.includes("waiting to prd"))   return "Waiting to PRD deploy";
    if (s.includes("block")) return "Blocked";
    if (s.includes("bug"))   return "Bugged";
    if (s.includes("cancel")||s.includes("remov")) return "Removed/Canceled";
    return "To Do";
  }

  const statePri = s => {const l=(s||"").toLowerCase();if(l.includes("block")||l.includes("bug"))return 0;if(l.includes("progress")||l.includes("review")||l.includes("test")||l.includes("waiting"))return 1;if(l.includes("done")||l.includes("closed")||l.includes("cancel")||l.includes("remov"))return 3;return 2;};

  let filtered = D.personTasks.filter(t => {
    if (sprintF!=="all" && String(t.sprint)!==sprintF) return false;
    if (statusF!=="all" && normState(t.state)!==statusF) return false;
    if (projF!=="all"   && t.project!==projF) return false;
    return true;
  });
  filtered.sort((a,b) => { const sd=(b.sprint||0)-(a.sprint||0); return sd!==0?sd:statePri(a.state)-statePri(b.state); });

  const sel = {background:"var(--panel-hi)",color:"var(--text)",border:"1px solid var(--border)",borderRadius:8,padding:"8px 12px",font:"600 13px/1 var(--font)",outline:"none",cursor:"pointer"};
  return <div>
    <div className="task-filters">
      <select style={sel} value={sprintF} onChange={e=>setSprintF(e.target.value)}>
        <option value="all">All Sprints</option>
        {sprintOptions.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
      </select>
      <select style={sel} value={statusF} onChange={e=>setStatusF(e.target.value)}>
        <option value="all">All Statuses</option>
        {STATUS_LABELS_ALL.map(s=><option key={s} value={s}>{s}</option>)}
      </select>
      <select style={sel} value={projF} onChange={e=>setProjF(e.target.value)}>
        <option value="all">All Projects</option>
        {projOptions.map(p=><option key={p} value={p}>{p}</option>)}
      </select>
      <span style={{fontSize:13,fontWeight:700,color:"var(--faint)",alignSelf:"center"}}>{filtered.length} tasks</span>
    </div>
    {filtered.length===0
      ?<div style={{textAlign:"center",color:"var(--faint)",padding:"32px 0",fontSize:14,fontWeight:600}}>No tasks match filters.</div>
      :<div style={{display:"flex",flexDirection:"column",gap:6}}>
        {filtered.map((t,i)=>{
          const pts=parseFloat(t.points)||0;
          const bucket=normState(t.state);
          const style=STATE_STYLE_MAP[bucket]||{bg:"rgba(90,99,121,.18)",color:"#94a3b8"};
          return <div key={i} className="task-item">
            <div style={{flex:1,minWidth:0}}>
              <div className="task-title" title={t.title}>{t.title||"(untitled)"}</div>
              <div className="task-meta">
                <span className="task-state" style={{background:style.bg,color:style.color}}>{t.state||"—"}</span>
                {pts>0&&<span className="task-pts">{pts}pt{pts!==1?"s":""}</span>}
                <span className="task-sprint">Sprint {t.sprint||"—"}</span>
                {t.project&&<span className="task-project" title={t.project}>{t.project}</span>}
              </div>
            </div>
          </div>;
        })}
      </div>
    }
  </div>;
}
window.__TaskListExport = TaskList;
</script>

<!-- ── App (root) ──────────────────────────────────────────────────────────── -->
<script type="text/babel">
const CLAIM_KEY_PREFIX = "sprint_claimed_v1_";

function loadClaimed(name) {
  try { const r=localStorage.getItem(CLAIM_KEY_PREFIX+name); if(r) return JSON.parse(r); } catch(e){}
  return [];
}

function App() {
  const D = window.DATA;
  const {useTweaks,TweaksPanel,TweakSection,TweakToggle,TweakButton,TweakColor} = window.__TweakExports;
  const {StatCard,StatusHeroCard,StatusChip,InsightCard} = window.__ComponentExports;
  const {SprintTrendChart,ChartLegend} = window.__ChartExports;
  const {RewardHero,MilestoneTrack,RewardsSection} = window.__GameExports;
  const TaskList = window.__TaskListExport;

  const TWEAK_DEFAULTS = {
    accent: ["#7c7ff5","#6366f1"],
    rewardColor: "#f5c518",
    confetti: true,
    showJourney: true,
  };

  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [claimed, setClaimed] = useState(() => loadClaimed(D.person.name));
  const rewardsRef = useRef(null);
  const points = D.stats.totalPoints;

  useEffect(() => {
    try { localStorage.setItem(CLAIM_KEY_PREFIX+D.person.name, JSON.stringify(claimed)); } catch(e){}
  }, [claimed]);

  function claim(pts) { setClaimed(c => c.includes(pts)?c:[...c,pts]); }
  function scrollToRewards() {
    const el=rewardsRef.current;
    if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-20,behavior:"smooth"});
  }

  const accentVars = {"--indigo":t.accent[0],"--indigo-deep":t.accent[1],"--gold":t.rewardColor};

  return <div className="wrap" style={accentVars}>
    {/* Header */}
    <div className="topbar">
      <a className="btn-back" href="/">← Back</a>
      <div className="avatar" style={{background:`linear-gradient(150deg, ${t.accent[0]}, ${t.accent[1]})`,boxShadow:`0 8px 22px ${t.accent[1]}66`}}>{D.person.initials}</div>
      <div className="who">
        <div className="who-top">
          <h1>{D.person.name}</h1>
          <span className="role-badge" style={{color:t.accent[0],border:`1px solid ${t.accent[0]}55`,background:`${t.accent[0]}18`}}>{D.person.role}</span>
        </div>
        <div className="who-sub">{D.person.sprintsActive}/{D.person.sprintsTotal} sprints active · <b>{D.person.totalPoints.toLocaleString(undefined,{maximumFractionDigits:1})} pts</b> · {D.person.totalTasks} tasks</div>
      </div>
      <div className="spacer"/>
    </div>

    {/* Gamification hero */}
    <RewardHero points={points} rewards={D.rewards} claimed={claimed} tiers={D.tiers} onScrollToRewards={scrollToRewards}/>

    {/* Status */}
    <div className="section-label">Task Status</div>
    <div className="grid" style={{gridTemplateColumns:"repeat(3,1fr)"}}>
      {D.statusHero.map((s,i)=><StatusHeroCard key={s.key} s={s} delay={i*60}/>)}
    </div>
    {D.statusRest.length>0&&<div className="grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",marginTop:14}}>
      {D.statusRest.map((s,i)=><StatusChip key={i} s={s}/>)}
    </div>}

    {/* Milestone journey */}
    {t.showJourney&&<div style={{marginTop:26}}>
      <MilestoneTrack points={points} rewards={D.rewards} claimed={claimed}/>
    </div>}

    {/* Rewards store */}
    <div style={{marginTop:16}}>
      <RewardsSection points={points} claimed={claimed} onClaim={claim} anchorRef={rewardsRef} confetti={t.confetti}/>
    </div>

    {/* Stats strip */}
    <div className="section-label">Overview</div>
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))"}}>
      <StatCard label="Total Points"  value={D.stats.totalPoints.toLocaleString(undefined,{maximumFractionDigits:1})} sub="all sprints" delay={0}/>
      <StatCard label="Total Tasks"   value={D.stats.totalTasks}       sub="done tasks" delay={40}/>
      <StatCard label="Done Rate"     value={D.stats.doneRatePct+"%"}  sub={`${D.stats.donePts} / ${D.stats.targetPts} pts`} accent="var(--green)" delay={80}/>
      <StatCard label="Avg Pts/Task"  value={D.stats.avgPtsPerTask}    sub="done tasks" delay={120}/>
      <StatCard label="Active Sprints"value={D.stats.activeSprints}    sub={`of ${D.stats.sprintsTotal} total`} delay={160}/>
      <StatCard label="Projects"      value={D.stats.projects}         sub="contributed to" delay={200}/>
    </div>

    {/* Insights */}
    <div className="section-label">Insights</div>
    <div className="grid" style={{gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))"}}>
      {D.insights.map((it,i)=><InsightCard key={i} it={it} delay={i*50}/>)}
    </div>

    {/* Sprint trend */}
    <div style={{marginTop:26}}>
      <div className="panel panel-pad rise">
        <div className="panel-head"><h2>Sprint Trend</h2><span className="pill">Story Points + Tasks</span></div>
        <ChartLegend/>
        <SprintTrendChart data={D.sprintTrend} ptsMax={D.ptsMax} taskMax={D.taskMax}/>
      </div>
    </div>

    {/* Leave */}
    {D.leave.length>0&&<>
      <div className="section-label">Leave History</div>
      <div className="panel" style={{padding:"16px 20px",display:"flex",alignItems:"center",gap:14,flexWrap:"wrap"}}>
        <span style={{fontSize:18}}>🗓</span>
        <span style={{fontWeight:700}}>Leave &amp; Holidays</span>
        {D.leave.map((l,i)=><span key={i} style={{display:"inline-flex",alignItems:"center",gap:8,background:"var(--panel-2)",border:"1px solid var(--border)",borderRadius:999,padding:"8px 14px",fontSize:13,fontWeight:600,color:"var(--muted)"}}>
          {l.icon} Sprint {l.sprint} · {l.kind} {l.days}d · {l.range}
        </span>)}
      </div>
    </>}

    {/* All tasks */}
    <div className="section-label">All Tasks</div>
    <div className="panel panel-pad">
      <TaskList/>
    </div>

    <div style={{color:"var(--faint)",fontSize:12,textAlign:"center",marginTop:32,fontWeight:500}}>
      More Studio.Co.,Ltd · <a href="/" style={{color:"var(--indigo)",textDecoration:"none"}}>Dashboard</a>
    </div>

    <TweaksPanel>
      <TweakSection label="Theme"/>
      <TweakColor label="Accent" value={t.accent}
        options={[["#7c7ff5","#6366f1"],["#34e3a8","#10b981"],["#b06cff","#8b5cf6"],["#3ad8e8","#06b6d4"],["#fb9e5a","#f5733a"]]}
        onChange={v=>setTweak('accent',v)}/>
      <TweakColor label="Reward color" value={t.rewardColor}
        options={["#f5c518","#f43f6e","#2ad4e5","#2fd39b"]}
        onChange={v=>setTweak('rewardColor',v)}/>
      <TweakSection label="Gamification"/>
      <TweakToggle label="Show reward journey" value={t.showJourney} onChange={v=>setTweak('showJourney',v)}/>
      <TweakToggle label="Confetti on redeem"  value={t.confetti}    onChange={v=>setTweak('confetti',v)}/>
      <TweakButton label="Reset claimed rewards" onClick={()=>setClaimed([])}/>
    </TweaksPanel>
  </div>;
}

// Wait for Firebase data then mount
function mountWhenReady() {
  if (window.__dataReady) {
    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  } else {
    window.addEventListener("dataReady", () => ReactDOM.createRoot(document.getElementById("root")).render(<App/>), {once:true});
  }
}
mountWhenReady();
</script>
</body>
</html>
