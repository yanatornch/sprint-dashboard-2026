function Glyph({ name, size = 20 }) {
  const s = { width: size, height: size, display: "block" };
  const c = { fill: "none", stroke: "currentColor", strokeWidth: 2.1, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {
    case "gear": return <svg viewBox="0 0 24 24" style={s}><g {...c}><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 13a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 6.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 2.6h.05A1.7 1.7 0 0 0 10 1.05V1a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 21.4 9v.05A1.7 1.7 0 0 0 22.95 10H23a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></g></svg>;
    case "share": return <svg viewBox="0 0 24 24" style={s}><g {...c}><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.3 10.7 7.4-4.3M8.3 13.3l7.4 4.3"/></g></svg>;
    case "logout": return <svg viewBox="0 0 24 24" style={s}><g {...c}><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></g></svg>;
    case "edit": return <svg viewBox="0 0 24 24" style={{ width: size, height: size }}><g {...c}><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></g></svg>;
    case "info": return <svg viewBox="0 0 24 24" style={s}><g {...c}><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></g></svg>;
    case "lock": return <svg viewBox="0 0 24 24" style={{ width: size, height: size }}><g {...c}><rect x="4.5" y="10.5" width="15" height="10" rx="2.4"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></g></svg>;

}

function TrendCard({ data, delay = 0 }) {
  const W = 720, H = 300, padL = 12, padR = 12, padT = 18, padB = 34;
  const iW = W - padL - padR, iH = H - padT - padB;
  const n = data.length, band = iW / n;
  const ptsMax = 180, taskMax = 60;
  const x = (i) => padL + band * (i + 0.5);
  const yP = (v) => padT + iH * (1 - v / ptsMax);
  const yT = (v) => padT + iH * (1 - v / taskMax);

  const lp = data.map((d, i) => ({ x: x(i), y: yT(d.tasks) }));
  let path = `M ${lp[0].x} ${lp[0].y}`;
  for (let i = 0; i < lp.length - 1; i++) {
    const p0 = lp[i-1] || lp[i], p1 = lp[i], p2 = lp[i+1], p3 = lp[i+2] || p2;
    path += ` C ${p1.x+(p2.x-p0.x)/6} ${p1.y+(p2.y-p0.y)/6}, ${p2.x-(p3.x-p1.x)/6} ${p2.y-(p3.y-p1.y)/6}, ${p2.x} ${p2.y}`;
  }

  return (
    <div className="card pad rise span-2" style={{ animationDelay: delay+"ms" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8, flexWrap:"wrap", gap:8 }}>
        <div className="klabel">Sprint Trend</div>
        <div style={{ display:"flex", gap:16 }}>
          <span style={{ display:"inline-flex", alignItems:"center", gap:7, font:"700 12px/1 var(--font)", color:"var(--label)" }}>
            <span style={{ width:12, height:12, borderRadius:3, background:"var(--bar)" }} /> Story points
          </span>
          <span style={{ display:"inline-flex", alignItems:"center", gap:7, font:"700 12px/1 var(--font)", color:"var(--label)" }}>
            <span style={{ width:14, height:3, borderRadius:2, background:"var(--line)" }} /> Tasks
          </span>
        </div>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:"auto", display:"block" }}>
        {[0,60,120,180].map(v => (
          <line key={v} x1={padL} y1={yP(v)} x2={W-padR} y2={yP(v)} stroke="var(--ring-bg)" strokeWidth="1" />
        ))}
        {data.map((d, i) => {
          const bw = band * 0.46, h = iH * (d.pts / ptsMax);
          return (
            <g key={i}>
              <rect x={x(i)-bw/2} y={yP(d.pts)} width={bw} height={Math.max(h,0)} rx="4" fill="var(--bar)" opacity={d.pts ? 0.95 : 0.25} />
              <text x={x(i)} y={H-12} textAnchor="middle" fontSize="11" fontWeight="700" fill="var(--label)" fontFamily="var(--font)">S{d.sprint}</text>
            </g>
          );
        })}
        <path d={path} fill="none" stroke="var(--line)" strokeWidth="3" strokeLinecap="round" />
        {lp.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="4" fill="var(--card)" stroke="var(--line)" strokeWidth="2.5" />)}
      </svg>
    </div>
  );
}

function RewardsJourney({ rewards, points, claimed, setClaimed, mascots, delay = 0 }) {
  const maxPts = rewards[rewards.length - 1].pts;
  const pct = Math.min(100, Math.round((points / maxPts) * 100));
  const stateOf = (r) => claimed.includes(r.pts) ? "claimed" : (r.pts <= points ? "ready" : "locked");
  const readyCount = rewards.filter(r => stateOf(r) === "ready").length;
  const unlockedRewards = rewards.filter(r => r.pts <= points);
  const nextReward = rewards.find(r => r.pts > points);

  return (
    <div className="card dark pad rise span-2" style={{ animationDelay: delay+"ms" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div className="klabel on-dark">{mascots ? "🎁 " : ""}Rewards Journey</div>
        <span className="dpill" style={{ background:"var(--ring-bg)", color:"var(--on-dark)" }}>{readyCount} ready to redeem</span>
      </div>

      <div className="figure" style={{ fontSize:40, color:"var(--on-dark)", margin:"8px 0 4px" }}>
        {unlockedRewards.length} / {rewards.length} unlocked
      </div>
      <div style={{ font:"700 13px/1.4 var(--font)", color:"var(--on-dark-label)", marginBottom:18 }}>
        {nextReward
          ? `${nextReward.pts - points} pts to unlock ${nextReward.emoji} ${nextReward.name}`
          : mascots ? "🏆 All rewards unlocked!" : "All rewards unlocked!"}
      </div>

      {/* spectrum bar with knob */}
      <div style={{ position:"relative", height:56 }}>
        <div style={{ position:"absolute", top:12, left:0, right:0, height:32, borderRadius:999, background:"var(--spectrum-track)", overflow:"hidden" }}>
          <div style={{ position:"absolute", inset:0, width: pct+"%", background:"var(--spectrum)", borderRadius:999 }} />
        </div>
        {mascots && (
          <>
            <div aria-hidden="true" style={{ position:"absolute", top:6, left:8, fontSize:30, lineHeight:1, zIndex:2 }}>🌱</div>
            <div aria-hidden="true" style={{ position:"absolute", top:6, right:8, fontSize:30, lineHeight:1, zIndex:2 }}>✈️</div>
          </>
        )}
        <div style={{ position:"absolute", top:4, left:`calc(${pct}% - 24px)`, width:48, height:48, borderRadius:"50%", background:"#fff", border:"3px solid var(--card-dark)", boxShadow:"0 4px 12px rgba(0,0,0,.35)", display:"grid", placeItems:"center", zIndex:3 }}>
          <span style={{ font:"800 11px/1 var(--display)", color:"#15110a" }}>{points}</span>
        </div>
      </div>
      <div style={{ display:"flex", justifyContent:"space-between", marginTop:6, font:"800 11px/1 var(--display)", letterSpacing:1, textTransform:"uppercase", color:"var(--on-dark-label)" }}>
        <span>0 pts</span><span>{maxPts} pts</span>
      </div>

      {/* unlocked reward emojis row */}
      {unlockedRewards.length > 0 && (
        <div style={{ marginTop:18, display:"flex", flexWrap:"wrap", gap:8 }}>
          {unlockedRewards.map(r => {
            const st = stateOf(r);
            return (
              <div key={r.pts} title={`${r.name} — ${r.desc}`}
                onClick={() => { if (st === "ready") setClaimed(prev => [...prev, r.pts]); }}
                style={{ width:44, height:44, borderRadius:12, display:"grid", placeItems:"center", fontSize:22,
                  cursor: st==="ready" ? "pointer" : "default", position:"relative",
                  background: st==="claimed" ? "rgba(47,206,110,.2)" : "rgba(255,255,255,.12)",
                  border: `2px solid ${st==="claimed" ? "var(--good)" : st==="ready" ? "var(--warn)" : "rgba(255,255,255,.15)"}`,
                  boxShadow: st==="ready" ? "0 0 12px rgba(246,166,35,.5)" : "none" }}>
                {r.emoji}
                {st === "claimed" && (
                  <span style={{ position:"absolute", top:-5, right:-5, width:16, height:16, borderRadius:"50%", background:"var(--good)", color:"#06250f", display:"grid", placeItems:"center", fontSize:9, fontWeight:900 }}>✓</span>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function LeaderboardTable({ leaderboard, myName, myRoleColor, delay = 0 }) {
  const [metric, setMetric] = useState("pts");

  const rows = [...leaderboard].sort((a,b) => {
    if (metric === "tasks")    return b.tasks    - a.tasks;
    if (metric === "doneRate") return b.doneRate - a.doneRate;
    return b.pts - a.pts;
  });
  let cr = 1;
  rows.forEach((row, i) => {
    const val = row[metric];
    if (i > 0 && val === rows[i-1][metric]) row._rank = rows[i-1]._rank;
    else row._rank = cr;
    cr = row._rank + 1;
  });

  const maxVal = metric === "pts"      ? rows[0].pts
               : metric === "tasks"    ? rows[0].tasks
               : rows[0].doneRate;

  const getValue  = (row) => metric === "pts"      ? row.pts
                           : metric === "tasks"    ? row.tasks
                           : row.doneRate;
  const formatVal = (row) => metric === "pts"      ? row.pts.toLocaleString() + " pts"
                           : metric === "tasks"    ? row.tasks + " tasks"
                           : (row.doneRate * 100).toFixed(0) + "%";

  const tabStyle = (k) => ({
    padding:"8px 16px", borderRadius:999, cursor:"pointer",
    font:"700 12px/1 var(--display)", letterSpacing:".3px",
    border:`var(--strokeW) solid ${metric===k ? "var(--card-edge)" : "var(--ring-bg)"}`,
    background: metric===k ? "var(--ring-bg)" : "transparent",
    color: metric===k ? "var(--ink)" : "var(--label)",
    transition:"all .15s",
  });

  return (
    <div className="card pad rise span-2" style={{ animationDelay: delay+"ms" }}>

      {/* header */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:18, flexWrap:"wrap", gap:10 }}>
        <div className="klabel">🏆 Leaderboard</div>
        <div style={{ display:"flex", gap:6 }}>
          <button style={tabStyle("pts")}      onClick={() => setMetric("pts")}>Points</button>
          <button style={tabStyle("tasks")}    onClick={() => setMetric("tasks")}>Tasks</button>
          <button style={tabStyle("doneRate")} onClick={() => setMetric("doneRate")}>Done %</button>
        </div>
      </div>

      {/* rows */}
      <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
        {rows.map((row) => {
          const isMe   = row.name === myName;
          const medal  = row._rank <= 3 ? RANK_MEDAL[row._rank - 1] : null;
          const val    = getValue(row);
          const barPct = maxVal ? (val / maxVal) * 100 : 0;
          const barColor = isMe
            ? `linear-gradient(90deg, ${myRoleColor}, var(--bar))`
            : "var(--bar-soft)";
          const doneColor = row.doneRate >= .8 ? "var(--good)"
                          : row.doneRate >= .6 ? "var(--info)"
                          : "var(--warn)";

          return (
            <div key={row.name} style={{
              display:"grid",
              gridTemplateColumns:"40px 1fr auto",
              alignItems:"center",
              gap:12,
              padding:"12px 14px",
              borderRadius:16,
              border:`var(--strokeW) solid ${isMe ? `color-mix(in srgb, ${myRoleColor} 45%, var(--card-edge))` : "var(--card-edge)"}`,
              background: isMe ? `color-mix(in srgb, ${myRoleColor} 10%, var(--card))` : "var(--card)",
              boxShadow: isMe ? `0 0 0 2px color-mix(in srgb, ${myRoleColor} 30%, transparent)` : "none",
            }}>

              {/* rank */}
              <div style={{ textAlign:"center" }}>
                {medal
                  ? <span style={{ fontSize:22, lineHeight:1 }}>{medal}</span>
                  : <span className="figure" style={{ fontSize:15, color:"var(--label)" }}>#{row._rank}</span>
                }
              </div>

              {/* avatar + name + bar */}
              <div style={{ minWidth:0 }}>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:7 }}>
                  <div style={{
                    width:34, height:34, borderRadius:"50%", flexShrink:0,
                    display:"grid", placeItems:"center",
                    background:`linear-gradient(135deg, ${row.roleColor}cc, ${row.roleColor}77)`,
                    fontSize:12, fontWeight:800, color:"#fff",
                    boxShadow: isMe ? `0 0 0 2.5px ${myRoleColor}, 0 0 12px ${myRoleColor}66` : "none",
                  }}>{row.initials}</div>
                  <div style={{ minWidth:0 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap" }}>
                      <span className="figure" style={{ fontSize:15, color:"var(--ink)" }}>{row.name}</span>
                      {isMe && <span style={{
                        fontSize:10, fontWeight:800, padding:"2px 8px", borderRadius:999,
                        background:`color-mix(in srgb, ${myRoleColor} 20%, transparent)`,
                        color:myRoleColor,
                        border:`1px solid color-mix(in srgb, ${myRoleColor} 40%, transparent)`,
                      }}>You</span>}
                      <span style={{
                        fontSize:10.5, fontWeight:700, padding:"2px 8px", borderRadius:999,
                        color:row.tier.color,
                        background:`color-mix(in srgb, ${row.tier.color} 15%, transparent)`,
                        border:`1px solid color-mix(in srgb, ${row.tier.color} 30%, transparent)`,
                      }}>{row.tier.name}</span>
                    </div>
                    <div style={{ fontSize:11, color:row.roleColor, fontWeight:700, marginTop:1 }}>{row.role}</div>
                  </div>
                </div>

                {/* progress bar */}
                <div style={{ height:6, borderRadius:999, background:"var(--ring-bg)", overflow:"hidden" }}>
                  <div style={{
                    height:"100%", width: barPct.toFixed(1) + "%",
                    borderRadius:999,
                    background: barColor,
                    transition:"width .8s cubic-bezier(.2,.8,.2,1)",
                  }} />
                </div>
              </div>

              {/* value */}
              <div style={{ textAlign:"right", flexShrink:0 }}>
                <div className="figure" style={{
                  fontSize:20,
                  color: metric === "doneRate" ? doneColor : "var(--ink)",
                }}>{formatVal(row)}</div>
                {metric === "pts" && (
                  <div style={{ fontSize:11, color:"var(--label)", fontWeight:600, marginTop:2 }}>
                    {row.tasks} tasks
                  </div>
                )}
                {metric === "tasks" && (
                  <div style={{ fontSize:11, color:"var(--label)", fontWeight:600, marginTop:2 }}>
                    {row.pts.toLocaleString()} pts
                  </div>
                )}
                {metric === "doneRate" && (
                  <div style={{ fontSize:11, color:"var(--label)", fontWeight:600, marginTop:2 }}>
                    {row.pts.toLocaleString()} pts
                  </div>
                )}
              </div>

            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── TWEAKS PANEL ──────────────────────────────────────────────────────────────
function TweaksPanel({ open, onClose, children }) {
  if (!open) return null;
  return (
    <div className="twk-panel">
      <div className="twk-hd">
        <b>Tweaks</b>
        <button className="twk-x" onClick={onClose}>✕</button>
      </div>
      <div className="twk-body">{children}</div>
    </div>
  );
}

function TweakSection({ label }) {
  return <div className="twk-sect">{label}</div>;
}

function TweakRadio({ label, value, options, onChange }) {
  const opts = options.map(o => typeof o === "object" ? o : { value: o, label: o });
  const idx = Math.max(0, opts.findIndex(o => o.value === value));
  const n = opts.length;
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div className="twk-seg" style={{ position:"relative" }}>
        <div className="twk-seg-thumb" style={{ left:`calc(2px + ${idx} * (100% - 4px) / ${n})`, width:`calc((100% - 4px) / ${n})` }} />
        {opts.map(o => (
          <button key={o.value} type="button" style={{ zIndex:1, flex:1, border:0, background:"transparent", color:"inherit", font:"inherit", fontWeight:500, minHeight:22, borderRadius:6, cursor:"pointer", padding:"4px 6px" }}
            onClick={() => onChange(o.value)}>{o.label}</button>
        ))}
      </div>
    </div>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value?"1":"0"} onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakSlider({ label, value, min=0, max=100, unit="", onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span><span className="twk-val">{value}{unit}</span></div>
      <input type="range" className="twk-slider" min={min} max={max} value={value} onChange={e => onChange(Number(e.target.value))} />
    </div>
  );
}

function TweakText({ label, value, onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <input className="twk-field" type="text" value={value} onChange={e => onChange(e.target.value)} />
    </div>
  );
}

function TweakColor({ label, value, options, onChange }) {
  return (
    <div className="twk-row">
      <div className="twk-lbl"><span>{label}</span></div>
      <div className="twk-chips">
        {options.map((c, i) => (
          <button key={i} className="twk-chip" data-on={value===c?"1":"0"} style={{ background:c }} onClick={() => onChange(c)} />
        ))}
      </div>
    </div>
  );
}

function TweakButton({ label, onClick }) {
  return <button type="button" className="twk-btn" onClick={onClick}>{label}</button>;
}

// ── APP ───────────────────────────────────────────────────────────────────────
const CLAIM_KEY = "profile_claimed_v2";
function loadClaimed() {
  try { const r = localStorage.getItem(CLAIM_KEY); if (r) return JSON.parse(r); } catch(e) {}
  return [50, 100, 150, 200];
}

function tierIndex(points, tiers) {
  let idx = 0;
  tiers.forEach((t, i) => { if (points >= t.min) idx = i; });
  return idx;
}

function App() {
  const [theme, setTheme] = useState("sun");
  const [accent, setAccent] = useState("#f0467e");
  const [mascots, setMascots] = useState(true);
  const [name, setName] = useState("Ohm");
  const [tribe, setTribe] = useState("NCSWT");
  const [streak, setStreak] = useState(128);
  const [balance, setBalance] = useState(78);
  const [claimed, setClaimed] = useState(loadClaimed);
  const [tweakOpen, setTweakOpen] = useState(false);

  useEffect(() => { try { localStorage.setItem(CLAIM_KEY, JSON.stringify(claimed)); } catch(e) {} }, [claimed]);

  const points = DATA.stats.totalPoints;
  const tIdx = tierIndex(points, DATA.tiers);
  const levelNames = DATA.tiers.map(x => x.name);

  const dials = [
    { label: "Delivery",    value: Math.round(DATA.stats.doneRatePct), color: "var(--good)" },
    { label: "Velocity",    value: 78,  color: "var(--warn)" },
    { label: "Consistency", value: 64,  color: "var(--bad)"  },
    { label: "Focus",       value: 88,  color: "var(--info)" },
  ];

  const themeVars = {
    "--line":     accent,
    "--spectrum": `linear-gradient(90deg, ${accent}, color-mix(in srgb, ${accent} 42%, #fff))`,
  };

  const sectionLabel = (text) => (
    <div style={{ font:"700 12px/1 var(--font)", letterSpacing:"2px", textTransform:"uppercase",
      color:"var(--label)", margin:"28px 2px 14px" }} className="span-2">{text}</div>
  );

  return (
    <div className="stage" data-theme={theme} style={themeVars}>
      <div className="feed">

        {/* ── Header ── */}
        <ProfileHeader
          name={name}
          sub={[DATA.person.role.toUpperCase(), `${DATA.person.sprintsActive}/${DATA.person.sprintsTotal} SPRINTS`, `${DATA.person.totalTasks} TASKS`, `#${DATA.stats.myRank} of ${DATA.stats.teamSize}`]}
          mascots={mascots}
        />

        {/* ── Total points + mini stats ── */}
        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          <StreakCard value={points} mascots={mascots} delay={40} />
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
            <MiniStat icon="📋" value={DATA.stats.totalTasks} label="Total tasks" />
            <MiniStat icon="🎯" value={Math.round(parseFloat(DATA.stats.doneRatePct)) + "%"} label="Done rate" />
          </div>
        </div>

        {/* ── Top project card ── */}
        <TribeCard
          name={DATA.projEntries[0][0]}
          pts={DATA.projEntries[0][1]}
          projectCount={DATA.stats.projects}
          rank={DATA.stats.myRank}
          teamSize={DATA.stats.teamSize}
          mascots={mascots}
          delay={80}
        />

        {/* ── Rewards journey (work style slot) ── */}
        <RewardsJourney rewards={DATA.rewards} points={points} claimed={claimed} setClaimed={setClaimed} mascots={mascots} delay={120} />

        {/* ── Dev score + dials ── */}
        <DevScoreCard
          levelIndex={tIdx}
          levels={levelNames}
          levelLabel={`${DATA.tiers[tIdx].name.toUpperCase()} TIER`}
          dials={dials}
          mascots={mascots}
          delay={160}
        />

        {/* ── Status breakdown ── */}
        {sectionLabel("Task Status")}
        <StatusBreakdown hero={DATA.statusHero} rest={DATA.statusRest} totalTasks={DATA.person.totalTasks} delay={200} />

        {/* ── Stats strip ── */}
        {sectionLabel("Overview")}
        <StatCard label="Total Points"   value={parseFloat(DATA.stats.totalPoints).toLocaleString()} sub="all sprints"                                        accentColor="var(--bar)"  delay={0}   />
        <StatCard label="Done Rate"      value={DATA.stats.doneRatePct + "%"}                        sub={`${DATA.stats.donePts} / ${DATA.stats.targetPts} pts`} accentColor="var(--good)" delay={40}  />
        <StatCard label="Total Tasks"    value={DATA.stats.totalTasks}                               sub="across all sprints"                                  delay={80}  />
        <StatCard label="Avg Pts / Task" value={DATA.stats.avgPtsPerTask}                            sub="efficiency ratio"                                    delay={120} />
        <StatCard label="Active Sprints" value={DATA.stats.activeSprints}                            sub={`of ${DATA.stats.sprintsTotal} total`}               delay={160} />
        <StatCard label="Projects"       value={DATA.stats.projects}                                 sub="contributed to"                                      delay={200} />

        {/* ── Leaderboard ── */}
        {sectionLabel("Leaderboard")}
        <LeaderboardTable
          leaderboard={DATA.leaderboard}
          myName={DATA.person.name}
          myRoleColor={DATA.person.roleColor}
          delay={240}
        />

        {/* ── Insights ── */}
        {sectionLabel("Insights")}
        {DATA.insights.map((it, i) => <InsightCard key={i} it={it} delay={i*50} />)}

        {/* ── Sprint trend chart ── */}
        {sectionLabel("Sprint Trend")}
        <TrendCard data={DATA.sprintTrend} delay={280} />

        {/* ── Leave history ── */}
        {DATA.leave.length > 0 && <>
          {sectionLabel("Leave History")}
          <div className="card pad span-2" style={{ display:"flex", alignItems:"center", gap:14, flexWrap:"wrap" }}>
            <span style={{ fontSize:18 }}>🗓</span>
            <span style={{ fontWeight:700, color:"var(--ink)" }}>Leave &amp; Holidays</span>
            {DATA.leave.map((l, i) => (
              <span key={i} style={{ display:"inline-flex", alignItems:"center", gap:8,
                background:"var(--ring-bg)", border:`var(--strokeW) solid var(--card-edge)`,
                borderRadius:999, padding:"8px 14px", fontSize:13, fontWeight:600, color:"var(--label)" }}>
                {l.icon} Sprint {l.sprint} · {l.kind} {l.days}d · {l.range}
              </span>
            ))}
          </div>
        </>}

      </div>

      {/* floating tweaks toggle */}
      <button className="twk-fab" onClick={() => setTweakOpen(o => !o)} title="Open Tweaks">⚙️</button>

      <TweaksPanel open={tweakOpen} onClose={() => setTweakOpen(false)}>
        <TweakSection label="Theme" />
        <TweakRadio label="Look" value={theme} options={[{value:"sun",label:"Sun"},{value:"night",label:"Night"}]} onChange={setTheme} />
        <TweakColor label="Accent" value={accent} options={["#f0467e","#7c7ff5","#2ad4e5","#f6a623","#2fce6e"]} onChange={setAccent} />

        <TweakSection label="Profile" />
        <TweakText label="Name" value={name} onChange={setName} />

        <TweakSection label="Gamification" />
        <TweakToggle label="Mascots & emoji" value={mascots} onChange={setMascots} />
        <TweakSlider label="Streak" value={streak} min={0} max={365} unit="d" onChange={setStreak} />
        <TweakSlider label="Planner ↔ Shipper" value={balance} min={0} max={100} onChange={setBalance} />
        <TweakButton label="Reset claimed rewards" onClick={() => setClaimed([])} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
