<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ohm · Sprint Dashboard 2026</title>
<style>
  :root {
    --bg: #0a0f1c;
    --bg-2: #0d1424;
    --panel: #131b2e;
    --panel-2: #0f1626;
    --panel-hi: #1a2338;
    --border: rgba(255,255,255,.07);
    --border-hi: rgba(255,255,255,.12);
    --text: #e9edf6;
    --muted: #8b94a8;
    --faint: #5a6379;

    --indigo: #7c7ff5;
    --indigo-deep: #6366f1;
    --cyan: #2ad4e5;
    --teal: #34d399;
    --green: #2fd39b;
    --orange: #f5a524;
    --red: #f0556a;
    --yellow: #f5c518;
    --gold: #f5c518;
    --pink: #f43f6e;

    --r: 16px;
    --r-lg: 22px;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background:
      radial-gradient(1200px 600px at 18% -8%, rgba(124,127,245,.10), transparent 60%),
      radial-gradient(1000px 500px at 100% 0%, rgba(42,212,229,.06), transparent 55%),
      var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }
  ::selection { background: rgba(124,127,245,.35); }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 26px 28px 80px; }

  /* ---------- Header ---------- */
  .topbar { display: flex; align-items: center; gap: 18px; padding: 8px 2px 22px; }
  .btn-back {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 11px 16px; border-radius: 999px;
    font: 600 14px/1 var(--font); cursor: pointer; transition: .18s;
  }
  .btn-back:hover { background: var(--panel-hi); border-color: var(--border-hi); }
  .avatar {
    width: 60px; height: 60px; border-radius: 50%;
    display: grid; place-items: center; flex: none;
    background: linear-gradient(150deg, var(--indigo), var(--indigo-deep));
    font: 800 21px/1 var(--font); color: #fff; letter-spacing: .5px;
    box-shadow: 0 8px 22px rgba(99,102,241,.45);
  }
  .who { display: flex; flex-direction: column; gap: 3px; }
  .who-top { display: flex; align-items: center; gap: 12px; }
  .who-top h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
  .role-badge {
    font: 700 12px/1 var(--font); color: var(--indigo);
    border: 1px solid rgba(124,127,245,.5); background: rgba(124,127,245,.12);
    padding: 5px 10px; border-radius: 999px;
  }
  .who-sub { color: var(--muted); font-size: 14.5px; font-weight: 500; }
  .who-sub b { color: var(--text); font-weight: 700; }
  .spacer { flex: 1; }
  .toggle {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 10px 16px; border-radius: 999px;
    font: 600 14px/1 var(--font); cursor: pointer;
  }

  /* ---------- Generic panel ---------- */
  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border); border-radius: var(--r-lg);
    box-shadow: var(--shadow);
  }
  .panel-pad { padding: 22px 24px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .panel-head h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.2px; }
  .pill {
    font: 600 12.5px/1 var(--font); color: var(--muted);
    background: var(--panel-hi); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 999px;
  }
  .section-label {
    font: 700 12px/1 var(--font); letter-spacing: 2px; text-transform: uppercase;
    color: var(--faint); margin: 30px 2px 14px;
  }

  .grid { display: grid; gap: 16px; }

  /* subtle entrance — opacity untouched so content is never hidden */
  @keyframes rise { from { transform: translateY(10px); } to { transform: none; } }
  .rise { animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }

  /* confetti dot burst */
  @keyframes burst {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
  }

  button { font-family: var(--font); }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <script src="data.js"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="charts.jsx"></script>
  <script type="text/babel" src="gamification.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
