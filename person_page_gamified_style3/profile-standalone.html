/* ============================================================
   PLAYFUL LIGHT THEME — lavender canvas, white rounded cards,
   purple + gold + soft green/coral. Fredoka + Plus Jakarta Sans.
   ============================================================ */
:root {
  --display: "Fredoka", system-ui, sans-serif;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  /* ink */
  --ink:       #2b2150;
  --ink-soft:  #6c648c;
  --label:     #9a92b6;

  /* primary purple family (driven partly by --accent tweak) */
  --purple:      #7c5cf2;
  --purple-deep: #5d3fd6;
  --purple-soft: #efeafe;
  --purple-tint: #e6defc;

  /* support accents */
  --gold:       #f4be3f;
  --gold-soft:  #ffe7a8;
  --gold-deep:  #c98f12;
  --green:      #4fc187;
  --green-soft: #d7f2e3;
  --coral:      #f06aa0;
  --coral-soft: #fcdcea;
  --cyan:       #34c4dd;
  --cyan-soft:  #d5f1f6;
  --red:        #f0467e;

  /* surfaces */
  --card:       #ffffff;
  --card-edge:  rgba(124,92,242,.10);
  --radius:     26px;
  --radius-sm:  18px;
  --shadow:     0 16px 36px rgba(96,67,170,.13);
  --shadow-sm:  0 8px 20px rgba(96,67,170,.10);

  /* accent (tweakable) defaults to purple */
  --accent:      #7c5cf2;
  --accent-soft: #efeafe;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { -webkit-font-smoothing: antialiased; }

.stage {
  min-height: 100vh;
  width: 100%;
  background:
    radial-gradient(900px 520px at 88% -8%, #fde6ef 0%, transparent 55%),
    radial-gradient(820px 480px at 6% -4%, #efe7fb 0%, transparent 52%),
    linear-gradient(170deg, #efe9fa 0%, #e9e3f7 48%, #eee7f6 100%);
  font-family: var(--font);
  color: var(--ink);
  padding: 26px 16px 120px;
  line-height: 1.45;
}

.feed {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 15px;
}
@media (min-width: 900px) {
  .feed { max-width: 940px; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .span-2 { grid-column: 1 / -1; }
}
.feed > * { min-width: 0; }

/* ---------- card shell ---------- */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  min-width: 0;
}
.pad { padding: 22px 22px; }

.klabel {
  font: 700 12px/1 var(--font);
  letter-spacing: 1.4px; text-transform: uppercase;
  color: var(--label);
}

/* soft round chrome buttons */
.obtn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: none; background: #fff; color: var(--ink);
  border-radius: 999px; cursor: pointer; font: 600 13px/1 var(--display);
  box-shadow: var(--shadow-sm);
  transition: transform .12s ease, box-shadow .2s ease, background .2s ease;
}
.obtn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(96,67,170,.16); }
.obtn:active { transform: translateY(0); }
.obtn.round { width: 46px; height: 46px; padding: 0; border-radius: 50%; }
.obtn.pill  { padding: 12px 17px; }

/* primary pill */
.cta {
  border: none; border-radius: 999px; cursor: pointer;
  background: var(--accent); color: #fff;
  font: 600 14px/1 var(--display); letter-spacing: .2px;
  padding: 13px 20px; box-shadow: 0 10px 22px color-mix(in srgb, var(--accent) 40%, transparent);
  transition: transform .12s ease, filter .2s ease;
}
.cta:hover { transform: translateY(-1px); filter: brightness(1.04); }

.dpill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-soft); color: var(--purple-deep);
  border-radius: 999px; padding: 8px 13px;
  font: 600 12.5px/1 var(--display); letter-spacing: .2px;
}

.figure { font-family: var(--display); font-weight: 600; letter-spacing: -.3px; line-height: .95; }

/* entrance — animate transform only so content is never hidden */
@keyframes rise { from { transform: translateY(14px); } to { transform: none; } }
@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise .55s cubic-bezier(.2,.8,.2,1) both; }
}

/* twinkle for sparkles */
@keyframes twinkle { 0%,100% { opacity: .4; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
.spark { position: absolute; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) {
  .spark { animation: twinkle 2.6s ease-in-out infinite; }
}

button { font-family: var(--font); }
::selection { background: color-mix(in srgb, var(--purple) 26%, transparent); }

/* hide scrollbar on rails */
.norail::-webkit-scrollbar { height: 0; }

      <svg viewBox="0 0 24 24" style={s}><g {...c}><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></g></svg>
    );
    case "share": return (
      <svg viewBox="0 0 24 24" style={s}><g {...c}><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="m8.3 10.7 7.4-4.3M8.3 13.3l7.4 4.3"/></g></svg>
    );
    case "edit": return (
      <svg viewBox="0 0 24 24" style={s}><g {...c}><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></g></svg>
    );
    case "info": return (
      <svg viewBox="0 0 24 24" style={s}><g {...c}><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></g></svg>
    );
    case "arrow": return (
      <svg viewBox="0 0 24 24" style={s}><g {...c}><path d="M5 12h14M13 6l6 6-6 6"/></g></svg>
    );
    case "chevron": return (
      <svg viewBox="0 0 24 24" style={s}><g {...c}><path d="m9 6 6 6-6 6"/></g></svg>
    );
    case "home": return (
      <svg viewBox="0 0 24 24" style={s}><g {...c}><path d="M3 11l9-8 9 8M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/></g></svg>
    );
    case "compass": return (
      <svg viewBox="0 0 24 24" style={s}><g {...c}><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/></g></svg>
    );
    case "gift": return (
      <svg viewBox="0 0 24 24" style={s}><g {...c}><path d="M20 12v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-8M2 8h20v4H2zM12 8v13M12 8S10.5 3 8 3a2 2 0 0 0 0 5M12 8s1.5-5 4-5a2 2 0 0 1 0 5"/></g></svg>
    );
    case "user": return (
      <svg viewBox="0 0 24 24" style={s}><g {...c}><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></g></svg>
    );
    default: return null;
  }
}

/* tiny CSS sparkle (4-point star) */
function Spark({ top, left, right, bottom, size = 16, color = "#fff", delay = 0, op = .9 }) {
  return (

      </svg>
    </span>
  );
}

//  RewardsJourneySpectrum  (replaces WorkStyleCard slot, span-2)
// ══════════════════════════════════════════════════════════════════════════════
function RewardsJourneySpectrum({ rewards, points, claimed, setClaimed, mascots, delay = 0 }) {
  const maxPts = rewards[rewards.length - 1].pts;
  const pct = Math.min(98, Math.max(2, Math.round((points / maxPts) * 100)));
  const stateOf = (r) => claimed.includes(r.pts) ? "claimed" : (r.pts <= points ? "ready" : "locked");
  const readyCount = rewards.filter(r => stateOf(r) === "ready").length;
  const unlockedRewards = rewards.filter(r => r.pts <= points);
  const nextReward = rewards.find(r => r.pts > points);

  return (
    <div className="card pad rise span-2" style={{ position: "relative", animationDelay: delay + "ms" }}>
      {/* header row */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 4, flexWrap: "wrap", gap: 10 }}>
        <div className="klabel">{mascots ? "🎁 " : ""}Rewards Journey</div>
        <span className="dpill" style={{ background: "var(--gold-soft)", color: "var(--gold-deep)" }}>{readyCount} ready to redeem</span>
      </div>

      {/* big figure */}
      <div className="figure" style={{ fontSize: 40, color: "var(--ink)", margin: "10px 0 4px", lineHeight: 1 }}>
        {unlockedRewards.length} / {rewards.length} unlocked
      </div>

      {/* caption */}
      <div style={{ font: "600 13px/1.45 var(--font)", color: "var(--ink-soft)", marginBottom: 20, maxWidth: 460 }}>
        {nextReward
          ? <>{nextReward.pts - points} pts to unlock {nextReward.emoji} <b style={{ color: "var(--purple-deep)" }}>{nextReward.name}</b></>
          : mascots ? "🏆 All rewards unlocked!" : "All rewards unlocked!"}
      </div>

      {/* spectrum bar with knob */}
      <div style={{ position: "relative", height: 52 }}>
        <div style={{ position: "absolute", top: 10, left: 0, right: 0, height: 30, borderRadius: 999, background: "var(--purple-soft)", overflow: "hidden" }}>
          <div style={{ position: "absolute", inset: 0, width: pct + "%", borderRadius: 999,
            background: "linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 40%, #fff))" }} />
        </div>
        {mascots && <>
          <div aria-hidden="true" style={{ position: "absolute", top: 6, left: 9, fontSize: 26, lineHeight: 1, zIndex: 2 }}>🌱</div>
          <div aria-hidden="true" style={{ position: "absolute", top: 6, right: 9, fontSize: 26, lineHeight: 1, zIndex: 2 }}>✈️</div>
        </>}
        {/* knob */}
        <div style={{ position: "absolute", top: 1, left: `calc(${pct}% - 24px)`, width: 48, height: 48, borderRadius: "50%", background: "#fff", border: "4px solid var(--accent)", boxShadow: "0 6px 14px rgba(96,67,170,.3)", display: "grid", placeItems: "center", zIndex: 3 }}>
          <span style={{ font: "600 11px/1 var(--display)", color: "var(--purple-deep)" }}>{points}</span>
        </div>
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, font: "600 11px/1 var(--display)", letterSpacing: 1, textTransform: "uppercase", color: "var(--label)" }}>
        <span>0 pts</span><span>{maxPts} pts</span>
      </div>

      {/* unlocked reward emoji tiles */}
      {unlockedRewards.length > 0 && (
        <div style={{ marginTop: 18, display: "flex", flexWrap: "wrap", gap: 8 }}>
          {unlockedRewards.map(r => {
            const st = stateOf(r);
            return (
              <div key={r.pts} title={`${r.name} — ${r.desc}`}
                onClick={() => { if (st === "ready") setClaimed(prev => [...prev, r.pts]); }}
                style={{
                  width: 44, height: 44, borderRadius: 12, display: "grid", placeItems: "center", fontSize: 22,
                  cursor: st === "ready" ? "pointer" : "default", position: "relative",
                  background: st === "claimed" ? "var(--green-soft)" : st === "ready" ? "var(--gold-soft)" : "var(--purple-soft)",
                  border: `2.5px solid ${st === "claimed" ? "var(--green)" : st === "ready" ? "var(--gold)" : "rgba(124,92,242,.2)"}`,
                  boxShadow: st === "ready" ? "0 0 16px color-mix(in srgb, var(--gold) 55%, transparent)" : "none",
                  transition: "transform .12s ease",
                }}>
                {r.emoji}
                {st === "claimed" && (
                  <span style={{ position: "absolute", bottom: -4, right: -4, width: 18, height: 18, borderRadius: "50%", background: "var(--green)", color: "#fff", display: "grid", placeItems: "center", fontSize: 10, fontWeight: 900 }}>✓</span>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Dial({ value, label, color, delay = 0 }) {
  const R = 22, C = 2 * Math.PI * R;
  return (
    <div className="card rise" style={{ padding: "15px 16px", display: "flex", alignItems: "center", gap: 13,
      boxShadow: "none", border: "2px solid var(--purple-soft)", animationDelay: delay + "ms" }}>

        <svg viewBox="0 0 54 54" style={{ width: 52, height: 52, transform: "rotate(-90deg)" }}>
          <circle cx="27" cy="27" r={R} fill="none" stroke="var(--purple-soft)" strokeWidth="6.5" />
          <circle cx="27" cy="27" r={R} fill="none" stroke={color} strokeWidth="6.5" strokeLinecap="round"
            strokeDasharray={C} strokeDashoffset={C - (C * value) / 100}
            style={{ transition: "stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)" }} />
        </svg>
        <span className="figure" style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center", fontSize: 15, color: "var(--ink)" }}>{value}</span>
      </div>
      <span className="figure" style={{ fontSize: 17, color: "var(--ink)" }}>{label}</span>
    </div>

}

          <div style={{ position: "absolute", top: 11, left: 0, height: 5, width: `${(levelIndex / (n - 1)) * 100}%`, background: "var(--purple)", borderRadius: 999 }} />
          {levels.map((_, i) => {
            const left = `${(i / (n - 1)) * 100}%`;
            const done = i < levelIndex;
            const cur = i === levelIndex;
            return (
              <div key={i} style={{ position: "absolute", top: cur ? 1 : 5, left, transform: "translateX(-50%)",
                width: cur ? 24 : 16, height: cur ? 24 : 16, borderRadius: "50%",
                background: cur ? "#fff" : done ? "var(--purple)" : "rgba(124,92,242,.22)",
                border: cur ? "5px solid var(--purple)" : "none",
                boxShadow: cur ? "0 4px 10px rgba(96,67,170,.3)" : "none", zIndex: 2 }} />
            );
          })}
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 12, font: "600 11px/1 var(--display)", letterSpacing: 1, textTransform: "uppercase", color: "var(--label)" }}>
          <span>{levels[0]}</span><span>{levels[n - 1]}</span>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 16 }}>
        {dials.map((d, i) => <Dial key={d.label} {...d} delay={i * 90} />)}
      </div>
    </div>
  );
}

function StatusBreakdown({ hero, rest, totalTasks, delay = 0 }) {
  const all = [...hero, ...rest].filter(s => s.tasks > 0);
  const cmap = {
    "var(--green)": "var(--green)", "var(--cyan)": "var(--cyan)", "var(--indigo)": "var(--purple)",
    "var(--teal)": "#3fb6c4", "var(--orange)": "var(--gold)", "var(--faint)": "#c8c1e0", "var(--red)": "var(--coral)",
    "var(--cyan-soft)": "var(--cyan)", "var(--gold)": "var(--gold)", "var(--label)": "var(--label)", "var(--coral)": "var(--coral)",
  };
  const col = (c) => cmap[c] || c;
  return (
    <div className="card pad rise span-2" style={{ animationDelay: delay + "ms" }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 16 }}>
        <div className="klabel">Task Status</div>
        <span className="figure" style={{ fontSize: 18, color: "var(--ink)" }}>{totalTasks} <span style={{ fontSize: 12, fontWeight: 600, color: "var(--label)", fontFamily: "var(--font)" }}>tasks</span></span>
      </div>

      <div style={{ display: "flex", height: 16, borderRadius: 999, overflow: "hidden", background: "var(--purple-soft)" }}>
        {all.map((s, i) => (
          <div key={i} title={`${s.label}: ${s.tasks}`} style={{ width: `${(s.tasks / totalTasks) * 100}%`, background: col(s.color), borderRight: i < all.length - 1 ? "2px solid #fff" : "none" }} />
        ))}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px,1fr))", gap: 9, marginTop: 16 }}>
        {all.map((s, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8,
            background: "var(--purple-soft)", borderRadius: 14, padding: "10px 13px" }}>
            <span style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 0 }}>
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: col(s.color), flex: "none" }} />
              <span style={{ font: "600 12.5px/1.2 var(--font)", color: "var(--ink)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.label}</span>
            </span>
            <span className="figure" style={{ fontSize: 16, color: "var(--ink)" }}>{s.tasks}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

const BAR_COLORS = ["#9d8cf0","#f4be3f","#4fc187","#c4b6f4","#f4be3f","#9d8cf0","#34c4dd","#f06aa0","#4fc187","#9d8cf0","#f4be3f","#c4b6f4"];

function TrendCard({ data, delay = 0 }) {
  const [metric, setMetric] = useState("pts");
  const [open, setOpen] = useState(false);
  const vals = data.map(d => metric === "pts" ? d.pts : d.tasks);
  const max = Math.max(...vals, 1);
  const peak = vals.indexOf(max);

  return (
    <div className="card pad rise span-2" style={{ animationDelay: delay + "ms" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6, gap: 10 }}>
        <div>
          <div className="figure" style={{ fontSize: 22, color: "var(--ink)" }}>Sprint Progress</div>
          <div style={{ font: "600 12px/1.2 var(--font)", color: "var(--label)", marginTop: 4 }}>{metric === "pts" ? "Story points" : "Tasks closed"} per sprint</div>
        </div>
        <div style={{ position: "relative", flex: "none" }}>
          <button className="obtn pill" onClick={() => setOpen(o => !o)} style={{ padding: "10px 14px", background: "var(--purple-soft)", boxShadow: "none", color: "var(--purple-deep)", font: "600 12.5px/1 var(--display)" }}>
            {metric === "pts" ? "Story points" : "Tasks"} <Glyph name="chevron" size={13} />

            <div style={{ position: "absolute", right: 0, top: "calc(100% + 6px)", background: "#fff", borderRadius: 14, boxShadow: "var(--shadow)", padding: 6, zIndex: 5, minWidth: 140 }}>
              {[["pts", "Story points"], ["tasks", "Tasks"]].map(([k, lbl]) => (
                <button key={k} onClick={() => { setMetric(k); setOpen(false); }} style={{ display: "block", width: "100%", textAlign: "left", border: "none", cursor: "pointer", borderRadius: 10, padding: "9px 11px", font: "600 12.5px/1 var(--font)",
                  background: metric === k ? "var(--purple-soft)" : "transparent", color: metric === k ? "var(--purple-deep)" : "var(--ink-soft)" }}>{lbl}</button>
              ))}
            </div>
          )}
        </div>
      </div>

      <div style={{ display: "flex", alignItems: "flex-end", gap: "clamp(4px,1.2vw,10px)", height: 188, marginTop: 14, paddingTop: 26 }}>
        {data.map((d, i) => {
          const v = vals[i];
          const h = max ? (v / max) * 100 : 0;
          const isPeak = i === peak && v > 0;
          const c = BAR_COLORS[i % BAR_COLORS.length];
          return (
            <div key={i} style={{ flex: 1, minWidth: 0, height: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end" }}>
              <div style={{ marginBottom: 7, font: "600 11px/1 var(--display)",
                ...(isPeak
                  ? { background: "var(--purple)", color: "#fff", padding: "5px 9px", borderRadius: 999, boxShadow: "0 6px 14px color-mix(in srgb, var(--purple) 50%, transparent)" }
                  : { color: v ? "var(--ink-soft)" : "var(--label)", padding: "0 2px" }) }}>{v}</div>
              <div style={{ width: "100%", maxWidth: 30, height: `${Math.max(h, 2)}%`, minHeight: 6, borderRadius: 999,
                background: v ? (isPeak ? "var(--purple)" : c) : "rgba(124,92,242,.14)",
                boxShadow: isPeak ? "0 8px 18px color-mix(in srgb, var(--purple) 40%, transparent)" : "none",
                transition: "height .7s cubic-bezier(.2,.8,.2,1)" }} />
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: "clamp(4px,1.2vw,10px)", marginTop: 9 }}>
        {data.map((d, i) => (
          <div key={i} style={{ flex: 1, textAlign: "center", font: "600 10.5px/1 var(--font)", color: "var(--label)" }}>{d.sprint}</div>

// ══════════════════════════════════════════════════════════════════════════════
//  LEADERBOARD CARD (playful theme, span-2, card-per-row)
// ══════════════════════════════════════════════════════════════════════════════
const RANK_MEDAL = ["🥇","🥈","🥉"];

function LeaderboardCard({ leaderboard, myName, delay = 0 }) {
  const [metric, setMetric] = useState("pts");

  const rows = [...leaderboard].sort((a, b) => {
    if (metric === "tasks")    return b.tasks    - a.tasks;
    if (metric === "doneRate") return b.doneRate - a.doneRate;
    return b.pts - a.pts;
  });
  let cr = 1;
  rows.forEach((row, i) => {
    const val = row[metric === "doneRate" ? "doneRate" : metric];
    if (i > 0 && val === rows[i-1][metric === "doneRate" ? "doneRate" : metric]) row._rank = rows[i-1]._rank;
    else row._rank = cr;
    cr = row._rank + 1;
  });

  const maxVal = metric === "pts" ? rows[0].pts : metric === "tasks" ? rows[0].tasks : rows[0].doneRate;
  const getValue  = (row) => metric === "pts" ? row.pts : metric === "tasks" ? row.tasks : row.doneRate;
  const formatVal = (row) => metric === "pts" ? row.pts.toLocaleString() + " pts" : metric === "tasks" ? row.tasks + " tasks" : (row.doneRate * 100).toFixed(0) + "%";

  const tabSt = (k) => ({
    padding: "8px 14px", borderRadius: 999, cursor: "pointer", border: "none",
    font: "600 12px/1 var(--display)", letterSpacing: ".3px",
    background: metric === k ? "var(--accent)" : "var(--purple-soft)",
    color: metric === k ? "#fff" : "var(--purple-deep)",
    boxShadow: metric === k ? "0 6px 14px color-mix(in srgb, var(--accent) 40%, transparent)" : "none",
    transition: "all .15s",
  });

  return (
    <div className="card pad rise span-2" style={{ animationDelay: delay + "ms" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 18, flexWrap: "wrap", gap: 10 }}>
        <div className="klabel">🏆 Leaderboard</div>
        <div style={{ display: "flex", gap: 6 }}>
          <button style={tabSt("pts")}      onClick={() => setMetric("pts")}>Points</button>
          <button style={tabSt("tasks")}    onClick={() => setMetric("tasks")}>Tasks</button>
          <button style={tabSt("doneRate")} onClick={() => setMetric("doneRate")}>Done %</button>
        </div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {rows.map((row) => {
          const isMe = row.name === myName;
          const medal = row._rank <= 3 ? RANK_MEDAL[row._rank - 1] : null;
          const val = getValue(row);
          const barPct = maxVal ? (val / maxVal) * 100 : 0;
          const doneColor = row.doneRate >= .9 ? "var(--green)" : row.doneRate >= .75 ? "var(--cyan)" : "var(--gold)";

          return (
            <div key={row.name} style={{
              display: "grid",
              gridTemplateColumns: "44px 1fr auto",
              alignItems: "center",
              gap: 12,
              padding: "12px 14px",
              borderRadius: 18,
              background: isMe ? "var(--purple-soft)" : "rgba(239,234,254,.4)",
              boxShadow: isMe ? "0 0 0 2px var(--accent)" : "none",
              transition: "box-shadow .15s",
            }}>

              {/* rank */}
              <div style={{ textAlign: "center" }}>
                {medal
                  ? <span style={{ fontSize: 24, lineHeight: 1 }}>{medal}</span>
                  : <span className="figure" style={{ fontSize: 18, color: isMe ? "var(--purple-deep)" : "var(--label)" }}>#{row._rank}</span>
                }
              </div>

              {/* avatar + name + bar */}
              <div style={{ minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                  <div style={{
                    width: 36, height: 36, borderRadius: "50%", flexShrink: 0,
                    display: "grid", placeItems: "center",
                    background: `linear-gradient(135deg, ${row.roleColor}cc, ${row.roleColor}77)`,
                    fontSize: 12, fontWeight: 700, color: "#fff", fontFamily: "var(--display)",
                    boxShadow: isMe ? `0 0 0 3px var(--accent), 0 0 14px color-mix(in srgb, var(--accent) 40%, transparent)` : "none",
                  }}>{row.initials}</div>
                  <div style={{ minWidth: 0 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                      <span className="figure" style={{ fontSize: 15, color: "var(--ink)" }}>{row.name}</span>
                      {isMe && <span style={{
                        fontSize: 10, fontWeight: 700, padding: "2px 8px", borderRadius: 999,
                        background: "var(--accent)", color: "#fff",
                      }}>You</span>}
                      <span style={{
                        fontSize: 10.5, fontWeight: 600, padding: "2px 8px", borderRadius: 999,
                        color: row.tier.color,
                        background: `color-mix(in srgb, ${row.tier.color} 18%, #fff)`,
                        border: `1.5px solid color-mix(in srgb, ${row.tier.color} 35%, transparent)`,
                      }}>{row.tier.name}</span>
                    </div>
                    <div style={{ fontSize: 11, color: row.roleColor, fontWeight: 600, marginTop: 1, fontFamily: "var(--display)" }}>{row.role}</div>
                  </div>
                </div>

                {/* progress bar */}
                <div style={{ height: 6, borderRadius: 999, background: "rgba(124,92,242,.12)", overflow: "hidden" }}>
                  <div style={{
                    height: "100%", width: barPct.toFixed(1) + "%", borderRadius: 999,
                    background: isMe
                      ? "linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--cyan)))"
                      : `linear-gradient(90deg, color-mix(in srgb, ${row.roleColor} 60%, #fff), color-mix(in srgb, ${row.roleColor} 30%, #fff))`,
                    transition: "width .8s cubic-bezier(.2,.8,.2,1)",
                  }} />
                </div>
              </div>

              {/* value */}
              <div style={{ textAlign: "right", flexShrink: 0 }}>
                <div className="figure" style={{
                  fontSize: 20,
                  color: metric === "doneRate" ? doneColor : isMe ? "var(--purple-deep)" : "var(--ink)",
                }}>{formatVal(row)}</div>
                {metric === "pts" && (
                  <div style={{ fontSize: 11, color: "var(--label)", fontWeight: 600, marginTop: 2 }}>{row.tasks} tasks</div>
                )}
                {metric === "tasks" && (
                  <div style={{ fontSize: 11, color: "var(--label)", fontWeight: 600, marginTop: 2 }}>{row.pts.toLocaleString()} pts</div>
                )}
                {metric === "doneRate" && (
                  <div style={{ fontSize: 11, color: "var(--label)", fontWeight: 600, marginTop: 2 }}>{row.pts.toLocaleString()} pts</div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function useTweaks(defaults) {
  const [values, setValues] = useState(defaults);
  const setTweak = useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweakRow({ label, value, children, inline = false }) {
  return (

        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}

      {children}

  );
}

function TweakSection({ label }) {

}

function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}
const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true" style={{ position:"absolute", top:5, left:5, width:13, height:13, filter:"drop-shadow(0 1px 1px rgba(0,0,0,.3))" }}>
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>

          return (

                    aria-checked={on} data-on={on ? '1' : '0'}
                    style={{ background: o }}
                    onClick={() => onChange(o)}>
              {on && <__TwkCheck light={__twkIsLight(o)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

function TweaksPanel({ open, onClose, title = "Tweaks", children }) {
  const dragRef = useRef(null);
  const offsetRef = useRef({ x: 16, y: 80 });
  const PAD = 16;

  const clampToViewport = useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(clampToViewport);
      ro.observe(document.documentElement);
      return () => ro.disconnect();
    }
  }, [open, clampToViewport]);

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight  = window.innerWidth  - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight  - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <div ref={dragRef} className="twk-panel"
         style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
      <div className="twk-hd" onMouseDown={onDragStart}>
        <b>{title}</b>
        <button className="twk-x" aria-label="Close tweaks"
                onMouseDown={(e) => e.stopPropagation()}
                onClick={onClose}>✕</button>
      </div>
      <div className="twk-body">
        {children}
      </div>
    </div>
  );
}

          mascots={t.mascots} delay={150}
        />

        {/* 6. RewardsJourneySpectrum (WorkStyleCard slot, span-2) */}
        <RewardsJourneySpectrum
          rewards={DATA.rewards} points={points}
          claimed={claimed} setClaimed={setClaimed}
          mascots={t.mascots} delay={210}
        />

        {/* 7. DevScoreCard */}
        <DevScoreCard
          levelIndex={tIdx} levels={levelNames}
          levelLabel={`${DATA.tiers[tIdx].name.toUpperCase()} TIER`} tierColor={tierColor}
          dials={dials} mascots={t.mascots} delay={250}
        />

        {/* 8. StatusBreakdown */}
        <StatusBreakdown hero={DATA.statusHero} rest={DATA.statusRest} totalTasks={DATA.person.totalTasks} delay={290} />

        {/* 9. TrendCard */}
        <TrendCard data={DATA.sprintTrend} delay={330} />

        {/* 10. TrophyCard */}
        <TrophyCard
          title="Amazing work!"
          sub={`You're in the top 15% of shippers — ${Math.round(parseFloat(DATA.stats.doneRatePct))}% done rate this cycle.`}
          mascots={t.mascots} delay={370}
        />

        {/* 11. LeaderboardCard */}
        <LeaderboardCard
          leaderboard={DATA.leaderboard}
          myName={t.name}
          delay={400}
        />

        {/* 12. InsightCards grid (span-2, 2-col auto-fill) */}
        <div className="span-2" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px,1fr))", gap: 13 }}>
          {DATA.insights.map((it, i) => <InsightCard key={i} it={it} delay={i * 45 + 430} />)}
        </div>

        {/* 13. Leave history */}
        {DATA.leave.length > 0 && (
          <div className="card pad span-2" style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
            <span style={{ fontSize: 18 }}>🗓</span>
            <span style={{ font: "600 14px/1 var(--display)", color: "var(--ink)" }}>Leave &amp; Holidays</span>
            {DATA.leave.map((l, i) => (
              <span key={i} style={{ display: "inline-flex", alignItems: "center", gap: 8,
                background: "var(--purple-soft)", borderRadius: 999, padding: "8px 14px",
                font: "600 12.5px/1 var(--display)", color: "var(--ink-soft)" }}>
                {l.icon} Sprint {l.sprint} · {l.kind} {l.days}d · {l.range}
              </span>
            ))}
          </div>
        )}

      </div>

      {/* 14. BottomNav */}
      <BottomNav mascots={t.mascots} />

      {/* Tweaks FAB */}
      <button className="twk-fab" onClick={() => setTweakOpen(o => !o)} title="Open Tweaks" aria-label="Open tweaks panel">⚙️</button>

      {/* Tweaks Panel */}
      <TweaksPanel open={tweakOpen} onClose={() => setTweakOpen(false)}>
        <TweakSection label="Theme" />
        <TweakColor label="Accent" value={t.accent}
          options={["#7c5cf2", "#f06aa0", "#34c4dd", "#f4be3f", "#4fc187"]}
          onChange={(v) => setTweak('accent', v)} />

        <TweakSection label="Profile" />
        <TweakText label="Name" value={t.name} onChange={(v) => setTweak('name', v)} />

        <TweakSection label="Playfulness" />
        <TweakToggle label="Mascots &amp; emoji" value={t.mascots} onChange={(v) => setTweak('mascots', v)} />
        <TweakButton label="Reset claimed rewards" onClick={() => setClaimed([50, 100, 150, 200])} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
